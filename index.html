<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d4621a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Task Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ed;
  --bg-alt: #ebe7e1;
  --surface: #ffffff;
  --surface-tint: #faf8f5;
  --ink: #2a2520;
  --ink-secondary: #6b6258;
  --ink-muted: #9a9088;
  --ink-faint: #c4bbb0;
  --border: #ddd6cc;
  --border-light: #ebe5dd;
  --border-strong: #c4b8a8;
  --accent: #d4621a;
  --accent-hover: #b85415;
  --accent-light: #fdf0e6;
  --accent-bg: #f5e6d8;
  --red: #c0392b; --red-light: #f9ebea;
  --orange: #d4621a; --orange-light: #fdf0e6;
  --yellow: #b7892f; --yellow-light: #faf5e8;
  --green: #4a7c4c; --green-light: #eef5ef;
  --blue: #4a6fa5; --blue-light: #ecf1f7;
  --purple: #4a6fa5; --purple-light: #ecf1f7;
  --dirty: #b7892f;
  --shadow-sm: 0 1px 2px rgba(42,37,32,0.04), 0 1px 1px rgba(42,37,32,0.03);
  --shadow-md: 0 2px 8px rgba(42,37,32,0.06), 0 1px 3px rgba(42,37,32,0.04);
  --shadow-lg: 0 4px 16px rgba(42,37,32,0.08), 0 2px 6px rgba(42,37,32,0.05);
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-pill: 9999px;
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
.theme-matrix {
  --bg: #000000;
  --bg-alt: #0a0a0a;
  --surface: #0d0d0d;
  --surface-tint: #111111;
  --ink: #00ff41;
  --ink-secondary: #00cc33;
  --ink-muted: #008822;
  --ink-faint: #004411;
  --border: #003311;
  --border-light: #001a08;
  --border-strong: #00ff41;
  --accent: #00ff41;
  --accent-hover: #00cc33;
  --accent-light: #001a08;
  --accent-bg: #002211;
  --red: #ff0040; --red-light: #1a0008;
  --orange: #ff6600; --orange-light: #1a0a00;
  --yellow: #cccc00; --yellow-light: #1a1a00;
  --green: #00ff41; --green-light: #001a08;
  --blue: #00aaff; --blue-light: #001a22;
  --dirty: #cccc00;
  --shadow-sm: 0 0 4px rgba(0,255,65,0.08);
  --shadow-md: 0 0 8px rgba(0,255,65,0.12), 0 0 2px rgba(0,255,65,0.08);
  --shadow-lg: 0 0 16px rgba(0,255,65,0.15), 0 0 4px rgba(0,255,65,0.10);
  --font-sans: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
.theme-matrix .task-meta-tag { text-shadow: 0 0 4px currentColor; }
.theme-matrix .task-title { text-shadow: 0 0 2px rgba(0,255,65,0.3); }
.theme-matrix input:focus, .theme-matrix select:focus, .theme-matrix textarea:focus {
  box-shadow: 0 0 0 2px rgba(0,255,65,0.2), 0 0 8px rgba(0,255,65,0.15);
}
.theme-matrix .btn { background: transparent; }
.theme-matrix .btn-primary { background: var(--accent); color: #000; }
.theme-matrix .btn-primary:hover { background: var(--accent-hover); color: #000; }
.theme-matrix .modal-overlay { background: rgba(0,0,0,0.7); }
.theme-matrix .task-card.stale { background: #0a0a00; }
.theme-matrix .task-card.very-stale { background: #0d0800; }
.theme-matrix .task-card.blocked { background: #0d0008; }
.theme-matrix .task-card.thread { background: #0d0d08; }
.theme-matrix .btn-theme { border-color: var(--accent); color: var(--accent); font-weight: 700; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans);
  background: var(--bg); color: var(--ink); line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* Header */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap; gap: 8px;
}
.header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  padding: 7px 14px; border: 1px solid var(--border);
  border-radius: var(--r-md); background: var(--surface); color: var(--ink-secondary);
  font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); color: #fff; }
.btn-small { padding: 4px 10px; font-size: 0.75rem; }
.btn-danger { color: var(--red); border-color: var(--red); }
.btn-danger:hover { background: var(--red-light); }
.btn-disabled { opacity: 0.5; cursor: not-allowed; }
.btn-disabled:hover { background: var(--accent); }
.dirty-badge {
  padding: 3px 10px; background: var(--dirty); color: #fff;
  border-radius: var(--r-pill); font-size: 0.7rem; font-weight: 600;
  letter-spacing: 0.02em;
}

/* Quick Add */
.quick-add {
  display: flex; flex-direction: column; gap: 8px; margin-bottom: 2px;
  padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.quick-add-row {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.quick-add-task-field {
  flex: 1; min-width: 200px;
}
.quick-add input[type="text"] {
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--r-md); font-size: 0.92rem; font-family: var(--font-sans);
  color: var(--ink); background: var(--surface-tint); transition: all 0.15s;
  height: 42px; box-sizing: border-box;
}
.quick-add-task-field input[type="text"] {
  flex: none; width: 100%;
}
.quick-add-buttons {
  display: flex; gap: 8px; align-self: flex-end; margin-top: 2px;
}
.quick-add input[type="text"]::placeholder { color: var(--ink-faint); }
.quick-add input[type="text"]:focus {
  outline: none; border-color: var(--accent); background: var(--surface);
  box-shadow: 0 0 0 3px rgba(212,98,26,0.12);
}
.quick-add select {
  padding: 9px 12px; border: 1px solid var(--border);
  border-radius: var(--r-md); font-size: 0.82rem; font-family: var(--font-sans);
  color: var(--ink-secondary); background: var(--surface-tint);
}
.quick-add select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212,98,26,0.12);
}
.quick-add input[type="date"] {
  padding: 9px 12px; border: 1px solid var(--border);
  border-radius: var(--r-md); font-size: 0.82rem; font-family: var(--font-sans);
  color: var(--ink-secondary); background: var(--surface-tint);
}
.quick-add input[type="date"]:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212,98,26,0.12);
}
.quick-add-notes input[type="text"] {
  flex: none; min-width: 0; width: 100%;
  font-size: 0.85rem; color: var(--ink-secondary);
}
.quick-add-field {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.quick-add-label {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.quick-add-hint {
  font-size: 0.7rem; color: var(--ink-faint); padding: 6px 16px 8px; margin-bottom: 12px;
  font-family: var(--font-mono); letter-spacing: 0.01em;
}
.quick-add-badge {
  display: inline-block; padding: 2px 8px; background: var(--accent-light);
  color: var(--accent); border-radius: var(--r-pill); font-size: 0.7rem; font-weight: 600;
  font-family: var(--font-mono); margin-left: 6px;
}

/* View Tabs */
.view-tabs {
  display: flex; gap: 0; margin-bottom: 12px;
  border-bottom: 2px solid var(--border);
}
.view-tab {
  padding: 10px 24px; cursor: pointer; font-size: 0.88rem;
  font-weight: 600; color: var(--ink-muted);
  border-bottom: 3px solid transparent; transition: all 0.15s;
  margin-bottom: -2px; letter-spacing: -0.01em;
}
.view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.view-tab:hover { color: var(--ink); }

/* Week View */
.week-nav {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  padding: 12px 18px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  flex-wrap: wrap;
}
.week-nav h2 { font-size: 1rem; font-weight: 600; min-width: 100px; font-family: var(--font-mono); color: var(--ink); }
.week-nav-btn {
  width: 32px; height: 32px; border: 1px solid var(--border);
  border-radius: var(--r-md); background: var(--surface); cursor: pointer;
  font-size: 1rem; display: flex; align-items: center; justify-content: center;
  color: var(--ink-secondary); transition: all 0.15s;
}
.week-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.week-nav select {
  padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--r-md); font-size: 0.82rem; font-family: var(--font-sans); color: var(--ink-secondary);
  background: var(--surface-tint);
}
.week-nav select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212,98,26,0.12);
}
.week-nav-current { font-weight: 700; color: var(--accent); }
.week-stats {
  margin-left: auto; display: flex; gap: 12px; font-size: 0.78rem;
  color: var(--ink-secondary);
}
.week-stat { display: flex; align-items: center; gap: 4px; }
.week-stat-dot { width: 8px; height: 8px; border-radius: 50%; }

/* Task Card */
.task-card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 18px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-lg);
  margin-bottom: 8px; box-shadow: var(--shadow-sm); transition: all 0.15s;
}
.task-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.task-card.stale { border-left: 3px solid var(--yellow); background: #fdfbf7; }
.task-card.very-stale { border-left: 3px solid var(--orange); background: var(--accent-light); }
.task-card.thread { border-left: 3px dashed var(--purple); background: var(--purple-light); }
.task-card.blocked { border-left: 3px solid var(--red); background: var(--red-light); }
.task-card.done { opacity: 0.5; }
.task-card.done .task-title { text-decoration: line-through; color: var(--ink-muted); }
.task-card.delegated { opacity: 0.6; border-left: 3px solid var(--blue, #3498db); }
.task-card.delegated .task-title { color: var(--ink-muted); }
.task-card.carryover { border-left: 3px solid var(--orange); background: var(--orange-light); }

/* Carryover section */
.carryover-section {
  margin-bottom: 12px;
  padding: 12px 16px;
  background: var(--surface-tint);
  border: 1px solid var(--border-light);
  border-radius: var(--r-lg);
}
.carryover-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-size: 0.85rem; font-weight: 600; color: var(--orange);
}
.carryover-count {
  display: inline-block; padding: 1px 8px; background: var(--orange);
  color: #fff; border-radius: var(--r-pill); font-size: 0.72rem;
  font-weight: 600; font-family: var(--font-mono);
}
.tag-carryover {
  background: var(--orange-light); color: var(--orange);
  font-family: var(--font-mono); font-weight: 600;
}

/* Delegation tags */
.tag-delegated { background: var(--blue-light, rgba(52,152,219,0.12)); color: var(--blue, #2980b9); font-weight: 600; }
.tag-delegated-by { background: var(--accent-light); color: var(--accent); font-weight: 600; }

/* Delegated view */
.delegated-container { padding: 20px; }
.delegated-section { margin-bottom: 16px; }
.delegated-engineer-group { margin-bottom: 20px; }
.delegated-engineer-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.delegated-engineer-header h4 { font-size: 0.95rem; font-weight: 600; margin: 0; }

/* Delegate field in edit form */
.delegate-field { display: flex; gap: 6px; align-items: center; }
.delegate-field input[type="text"] { flex: 1; }

.task-checkbox {
  width: 20px; height: 20px; border: 2px solid var(--border-strong);
  border-radius: var(--r-sm); cursor: pointer; flex-shrink: 0;
  margin-top: 1px; transition: all 0.15s; background: var(--surface);
}
.task-checkbox:hover { border-color: var(--accent); }
.task-checkbox.checked {
  background: var(--green); border-color: var(--green);
  display: flex; align-items: center; justify-content: center;
}
.task-checkbox.checked::after {
  content: "\2713"; color: #fff; font-size: 12px; font-weight: bold;
}

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 0.92rem; font-weight: 600; color: var(--ink); margin-bottom: 5px; letter-spacing: -0.01em; }
.task-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.task-meta-tag {
  padding: 2px 8px; border-radius: var(--r-pill); font-weight: 600;
  font-size: 0.7rem; white-space: nowrap; letter-spacing: 0.01em;
}
.tag-priority-critical { background: var(--red-light); color: var(--red); }
.tag-priority-high { background: var(--orange-light); color: var(--orange); }
.tag-priority-medium { background: var(--yellow-light); color: var(--yellow); }
.tag-priority-low { background: var(--bg-alt); color: var(--ink-muted); }
.tag-energy-low { background: var(--green-light); color: var(--green); }
.tag-energy-medium { background: var(--yellow-light); color: var(--yellow); }
.tag-energy-high { background: var(--red-light); color: var(--red); }
.tag-status-blocked { background: var(--red-light); color: var(--red); }
.tag-status-in_progress { background: var(--blue-light); color: var(--blue); }
.tag-status-deferred { background: var(--bg-alt); color: var(--ink-muted); }
.tag-status-thread { background: var(--purple-light); color: var(--purple); }
.tag-due { background: var(--blue-light); color: var(--blue); font-family: var(--font-mono); }
.tag-due-overdue { background: var(--red-light); color: var(--red); font-family: var(--font-mono); font-weight: 700; }
.tag-stale { background: var(--orange-light); color: var(--orange); font-family: var(--font-mono); }
.tag-very-stale { background: var(--red-light); color: var(--red); font-family: var(--font-mono); }
.tag-project { background: var(--bg-alt); color: var(--ink-secondary); font-family: var(--font-mono); font-size: 0.68rem; }
.task-notes { font-size: 0.78rem; color: var(--ink-muted); margin-top: 5px; font-style: italic; }
.task-actions { display: flex; gap: 4px; flex-shrink: 0; margin-top: 1px; }
.task-action-btn {
  padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); cursor: pointer; font-size: 0.7rem;
  color: var(--ink-muted); transition: all 0.15s;
}
.task-action-btn:hover { border-color: var(--accent); color: var(--accent); }
.task-action-btn.danger:hover { border-color: var(--red); color: var(--red); }
.task-action-btn.quick-push { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; padding: 4px 6px; }
.task-action-btn.quick-push:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* Task Edit Form */
.task-edit {
  padding: 12px 16px; background: var(--accent-light);
  border: 1px solid var(--accent); border-radius: var(--r-lg); margin-bottom: 8px;
}
.task-edit-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px;
}
.task-edit-field { display: flex; flex-direction: column; gap: 2px; }
.task-edit-field label {
  font-size: 0.7rem; font-weight: 600; color: var(--ink-muted);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.task-edit-field input, .task-edit-field select, .task-edit-field textarea {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--r-sm);
  font-size: 0.85rem; font-family: var(--font-sans); background: var(--surface);
  color: var(--ink);
}
.task-edit-field input:focus, .task-edit-field select:focus, .task-edit-field textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212,98,26,0.12);
}
.task-edit-full { grid-column: 1 / -1; }
.task-edit-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Project View */
.project-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.project-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px; padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.project-header h2 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; cursor: pointer; }
.project-chevron {
  display: inline-block; margin-right: 6px; cursor: pointer;
  font-size: 0.9rem; color: var(--ink-muted); user-select: none;
}
.project-chevron:hover { color: var(--accent); }
.project-collapse-all-btn { min-width: 130px; }
.project-add-btn { min-width: 130px; }
.project-status-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 4px; background: var(--accent); color: #fff; }
.project-stats { font-size: 0.8rem; color: var(--ink-muted); font-family: var(--font-mono); }
.project-notes-display {
  font-size: 0.8rem; color: var(--ink-muted); margin-bottom: 12px; font-style: italic;
}
.project-no-project {
  padding: 40px 20px; text-align: center; color: var(--ink-muted);
  background: var(--surface); border: 2px dashed var(--border); border-radius: var(--r-lg);
}

/* Add Project Form */
.add-project-form {
  display: flex; gap: 8px; margin-bottom: 12px; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  align-items: center; flex-wrap: wrap; box-shadow: var(--shadow-sm);
}
.add-project-form input {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-sm);
  font-size: 0.85rem; font-family: var(--font-sans); color: var(--ink);
}
.add-project-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212,98,26,0.12); }

/* Filters */
.filter-bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 8px 16px; background: var(--surface-tint);
  border: 1px solid var(--border-light); border-radius: var(--r-md); margin-bottom: 12px;
}
.filter-bar label { font-size: 0.75rem; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.filter-bar select {
  padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--r-sm);
  font-size: 0.78rem; font-family: var(--font-sans); color: var(--ink-secondary); background: var(--surface);
}
.filter-bar select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(212,98,26,0.12);
}
.filter-bar .filter-btn {
  padding: 6px 14px; font-size: 0.8rem;
}
.filter-spacer { flex: 1; }

/* "What Can I Do" Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(42,37,32,0.4); display: flex;
  align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: var(--surface); border-radius: var(--r-xl); padding: 24px;
  max-width: 560px; width: 90%; max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.modal h3 { font-size: 1.2rem; margin-bottom: 4px; font-weight: 600; letter-spacing: -0.02em; }
.modal p.modal-desc { font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 16px; }

  const dayOfWeek = jan1.getDay() || 7;
  const weekStart = new Date(jan1);
  weekStart.setDate(jan1.getDate() + (week - 1) * 7 - dayOfWeek + 1);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  const fmt = (d) => `${d.getMonth()+1}/${d.getDate()}`;
  return `${fmt(weekStart)} - ${fmt(weekEnd)}`;
}

function weekContainsDate(weekStr, dateStr) {
  if (!weekStr || !dateStr) return false;
  const m = weekStr.match(/^(\d{4})-W(\d{2})$/);
  if (!m) return false;
  const year = parseInt(m[1]);
  const week = parseInt(m[2]);
  const jan1 = new Date(year, 0, 1);
  const dayOfWeek = jan1.getDay() || 7;
  const weekStart = new Date(jan1);
  weekStart.setDate(jan1.getDate() + (week - 1) * 7 - dayOfWeek + 1);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  const d = new Date(dateStr + 'T00:00:00');
  return d >= weekStart && d <= weekEnd;
}

function shiftWeek(weekStr, delta) {
  if (!weekStr) return currentISOWeek();
  const m = weekStr.match(/^(\d{4})-W(\d{2})$/);
  if (!m) return weekStr;
  const year = parseInt(m[1]);
  const week = parseInt(m[2]) + delta;
  let y = year, w = week;
  if (w < 1) { y--; w = 52; }
  if (w > 52) { y++; w = 1; }
  return `${y}-W${String(w).padStart(2, '0')}`;
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 0;
  const now = new Date(todayStr() + 'T00:00:00');
  return Math.floor((now - d) / 86400000);
}

function isOverdue(task) {
  if (!task.due || task.status === 'done' || task.status === 'deferred' || task.status === 'thread') return false;
  return task.due < todayStr();
}

function isStale(task) {
  if (task.status === 'done' || task.status === 'deferred') return false;
  const age = daysSince(task.last_touched || task.created);
  return age > 7;
}

function isVeryStale(task) {
  if (task.status === 'done' || task.status === 'deferred') return false;
  const age = daysSince(task.last_touched || task.created);
  return age > 14;
}

function nextTaskId(tasks) {
  let max = 0;
  for (const t of tasks) {
    const match = t.id && t.id.match(/^T(\d+)$/);
    if (match) max = Math.max(max, parseInt(match[1]));
  }
  return `T${String(max + 1).padStart(3, '0')}`;
}

function nextProjectId(projects) {
  let max = 0;
  for (const p of projects) {
    const match = p.id && p.id.match(/^P(\d+)$/);
    if (match) max = Math.max(max, parseInt(match[1]));
  }
  return `P${String(max + 1).padStart(3, '0')}`;
}

const PRIORITY_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
const PRIORITY_LABELS = { critical: 'CRIT', high: 'HIGH', medium: 'MED', low: 'LOW' };
const STATUS_LABELS = { open: 'Open', in_progress: 'In Progress', done: 'Done', blocked: 'Blocked', deferred: 'Deferred', thread: 'Thread' };
const ENERGY_LABELS = { low: 'LOW', medium: 'MED', high: 'HIGH' };
const CONTEXT_LABELS = { work: 'Work', home: 'Home', errand: 'Errand', anywhere: 'Anywhere' };

function sortTasks(tasks) {
  return [...tasks].sort((a, b) => {
    if (a.status === 'done' && b.status !== 'done') return 1;
    if (a.status !== 'done' && b.status === 'done') return -1;
    // Threads sort above non-threads (open loops stay visible)
    const aThread = a.status === 'thread';
    const bThread = b.status === 'thread';
    if (aThread && !bThread) return -1;
    if (!aThread && bThread) return 1;
    const pa = PRIORITY_ORDER[a.priority] ?? 3;
    const pb = PRIORITY_ORDER[b.priority] ?? 3;
    if (pa !== pb) return pa - pb;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1;
    if (b.due) return 1;
    return 0;
  });
}

// ===== Delegation Helpers =====
function delegationPrefix(owner) {
  if (!owner) return 'X';
  // Take first 3 chars of first word, uppercase
  return owner.trim().split(/[\s-]+/)[0].substring(0, 3).toUpperCase();
}

function buildDelegationFilename(targetOwner, managerOwner) {
  const today = todayStr();
  const time = nowTimeStr();
  const target = (targetOwner || 'engineer').trim().toLowerCase().replace(/\s+/g, '-');
  const from = delegationPrefix(managerOwner);
  return `delegated_${target}_${from}_${today}_${time}.yaml`;
}

function buildDelegationExport(allData, targetOwner, managerOwner) {
  // Filter tasks delegated to targetOwner
  const delegatedTasks = allData.tasks
    .filter(t => t.delegated_to === targetOwner)
    .map(t => {
      // Prefix the ID with manager's initials
      const prefix = delegationPrefix(managerOwner);
      const newId = t.id.startsWith(prefix + '-') ? t.id : `${prefix}-${t.id}`;
      return {
        ...t,
        id: newId,
        delegated_by: managerOwner || 'Manager',
        delegated_to: null,  // Clear on export — engineer owns it now
        delegation_date: t.delegation_date || todayStr()
      };
    });
  
  // Include projects referenced by delegated tasks
  const projectIds = [...new Set(delegatedTasks.map(t => t.project).filter(Boolean))];
  const projects = allData.projects.filter(p => projectIds.includes(p.id));
  
  return {
    meta: {
      created: todayStr(),
      last_review: null,
      owner: targetOwner,
      delegation_batch: true,
      delegated_by: managerOwner || 'Manager'
    },
    projects: projects,
    tasks: delegatedTasks
  };
}

function mergeDelegationBatch(existingData, batchData) {
  // Merge imported delegation tasks into existing data
  const existingIds = new Set(existingData.tasks.map(t => t.id));
  const newTasks = batchData.tasks.filter(t => !existingIds.has(t.id));
  // Merge projects (add new ones)
  const existingProjIds = new Set(existingData.projects.map(p => p.id));
  const newProjects = batchData.projects.filter(p => !existingProjIds.has(p.id));
  
  return {
    ...existingData,
    projects: [...existingData.projects, ...newProjects],
    tasks: [...existingData.tasks, ...newTasks]
  };
}

function buildSaveFilename(originalFilename, owner) {
  const today = todayStr();
  const time = nowTimeStr();
  // Use owner from settings if available, fallback to parsing original filename, then 'tasks'
  let base = 'tasks';
  if (owner && owner.trim()) {
    base = owner.trim().toLowerCase().replace(/\s+/g, '-');
  } else if (originalFilename) {
    const noExt = originalFilename.replace(/\.(ya?ml)$/i, "");
    const dateMatch = noExt.match(/^(.+)_\d{4}-\d{2}-\d{2}$/);
    base = dateMatch ? dateMatch[1] : noExt;
  }
  return `${base}_${today}_${time}.yaml`;
}

// ===== Inline Syntax Parser =====
function parseQuickAdd(text) {
  let title = text;
  let priority = null;
  let project = null;
  let energy = null;
  let due = null;
  let estimate = null;
  let newProjectName = null;
  let forceStatus = null;

  // Parse thread status: !thread (must be before priority — ! prefix is shared)
  const threadMatch = title.match(/!thread\b/i);
  if (threadMatch) {
    forceStatus = 'thread';
    title = title.replace(/!thread\b/i, '').trim();
  }

  // Parse priority: !critical/!high/!medium/!low
  const priMatch = title.match(/!(critical|high|medium|low)\b/i);
  if (priMatch) {
    priority = priMatch[1].toLowerCase();
    title = title.replace(/!(critical|high|medium|low)\b/i, '').trim();
  }

  // Parse project: @project-slug
  const projMatch = title.match(/@([\w][\w-]*)/);
  if (projMatch) {
    project = projMatch[1].toLowerCase();
    newProjectName = projMatch[1].replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    title = title.replace(/@[\w][\w-]*/, '').trim();
  }

  // Parse energy: #low/#medium/#high
  const energyMatch = title.match(/#(low|medium|high)\b/i);
  if (energyMatch) {
    energy = energyMatch[1].toLowerCase();
    title = title.replace(/#(low|medium|high)\b/i, '').trim();
  }

  // Parse estimate: ~30m or ~2h or ~1.5h
  const estMatch = title.match(/~(\d+(?:\.\d+)?[mh])\b/i);
  if (estMatch) {
    estimate = estMatch[1];
    title = title.replace(/~\d+(?:\.\d+)?[mh]\b/i, '').trim();
  }

  // Parse due date: due today/tomorrow/mon-sun/YYYY-MM-DD
  const dueMatch = title.match(/due\s+(today|tomorrow|mon|tue|wed|thu|fri|sat|sun|\d{4}-\d{2}-\d{2})/i);
  if (dueMatch) {
    const dueWord = dueMatch[1].toLowerCase();
    const today = new Date(todayStr() + 'T00:00:00');
    if (dueWord === 'today') {
      due = todayStr();
    } else if (dueWord === 'tomorrow') {
      const t = new Date(today);
      t.setDate(t.getDate() + 1);
      due = localDateStr(t);
    } else if (['mon','tue','wed','thu','fri','sat','sun'].includes(dueWord)) {
      const dayMap = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 0 };
      const targetDay = dayMap[dueWord];
      const t = new Date(today);
      const currentDay = t.getDay();
      let diff = targetDay - currentDay;
      if (diff <= 0) diff += 7;
      t.setDate(t.getDate() + diff);
      due = localDateStr(t);
    } else if (/^\d{4}-\d{2}-\d{2}$/.test(dueWord)) {
      due = dueWord;
    }
    if (due) {
      title = title.replace(/due\s+(today|tomorrow|mon|tue|wed|thu|fri|sat|sun|\d{4}-\d{2}-\d{2})/i, '').trim();
    }
  }

  // Clean up extra spaces
  title = title.replace(/\s+/g, ' ').trim();

  return { title, priority, project, energy, due, estimate, newProjectName, forceStatus };
}

      const buildCells = (taskSubset, doneSubset) => teamWeeks.map(wk => {
        const cellTasks = taskSubset.filter(t => t.week === wk);
        const score = cellTasks.reduce((sum, t) => sum + (PRIORITY_WEIGHTS[t.priority] || 0), 0);
        const highPriorityCount = cellTasks.filter(t => t.priority === 'critical' || t.priority === 'high').length;
        // v6.12 F1: Completed task score for prior weeks
        const isPastWeek = wk < cw;
        let completedScore = 0;
        let completedCount = 0;
        if (isPastWeek && doneSubset) {
          const doneInWeek = doneSubset.filter(t => (t.week_completed || t.week) === wk);
          completedScore = doneInWeek.reduce((sum, t) => sum + (PRIORITY_WEIGHTS[t.priority] || 0), 0);
          completedCount = doneInWeek.length;
        }
        const totalScore = score + completedScore;
        const totalCount = cellTasks.length + completedCount;
        return { score, count: cellTasks.length, highPriorityCount, tasks: cellTasks, week: wk,
                 completedScore, completedCount, totalScore, totalCount, isPastWeek };
      });

      const subRows = [
        { label: td.owner, isDelegated: false, delegatedTo: null, cells: buildCells(selfTasks, selfDoneTasks) }
      ];

      Object.keys(delegatedGroups).sort().forEach(engineer => {
        // Cross-reference dedup: if this engineer has their own loaded file, skip their sub-row
        const hasOwnFile = loadedOwners.some(o => o === engineer);
        if (!hasOwnFile) {
          subRows.push({
            label: `${td.owner} → ${engineer}`,
            isDelegated: true,
            delegatedTo: engineer,
            cells: buildCells(delegatedGroups[engineer], delegatedDoneGroups[engineer] || [])
          });
        }
      });

      return { owner: td.owner, capacity: td.capacity, subRows };
    });

  // ===== Priority cross-cut data =====

    const groups = { critical: [], high: [], medium: [], low: [] };
    const activeStatuses = ['open', 'in_progress', 'blocked'];
    teamData.forEach(td => {
      td.data.tasks.filter(t => activeStatuses.includes(t.status)).forEach(t => {
        const projName = td.data.projects.find(p => p.id === t.project)?.name || t.project || '';
        groups[t.priority || 'medium'].push({ ...t, engineer: td.owner, projectName: projName });
      });
    });
    // Sort each group by due date ascending (overdue first, no-due last)
    Object.keys(groups).forEach(k => {
      groups[k].sort((a, b) => {
        if (a.due && b.due) return a.due.localeCompare(b.due);
        if (a.due) return -1;
        if (b.due) return 1;
        return 0;
      });
    });
    return groups;
  }, [teamData]);

  // ===== Team review data =====
  const teamReviewData = useMemo(() => {
    const blocked = [];
    const stale = [];
    const upcoming = [];
    const overloaded = [];

    const today = todayStr();
    const sevenDaysLater = new Date(today + 'T00:00:00');
    sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);
    const sevenDaysStr = localDateStr(sevenDaysLater);

    teamData.forEach(td => {
      td.data.tasks.forEach(t => {
        const entry = { ...t, engineer: td.owner, projectName: td.data.projects.find(p => p.id === t.project)?.name || t.project || '' };
        if (t.status === 'blocked') blocked.push(entry);
        if (isStale(t) || isVeryStale(t)) {
          stale.push({ ...entry, daysOld: daysSince(t.last_touched || t.created), veryStale: isVeryStale(t) });
        }
        if (t.due && t.due >= today && t.due <= sevenDaysStr && t.status !== 'done' && t.status !== 'deferred') {
          upcoming.push(entry);
        }
      });
    });

    // Overloaded weeks derived from workloadData (F8: iterate subRows)
    workloadData.forEach(wd => {
      wd.subRows.forEach(subRow => {
        subRow.cells.forEach((cell, idx) => {
          if (cell.score > LOAD_SCORE_RED) {
            overloaded.push({ engineer: subRow.label, week: teamWeeks[idx], score: cell.score, level: 'RED' });
          } else if (cell.score > LOAD_SCORE_YELLOW) {
            overloaded.push({ engineer: subRow.label, week: teamWeeks[idx], score: cell.score, level: 'YELLOW' });
          }
        });
      });
    });

    // Sort upcoming by due ascending
    upcoming.sort((a, b) => a.due.localeCompare(b.due));

    return { blocked, stale, upcoming, overloaded };
  }, [teamData, workloadData, teamWeeks]);

      if (e.key === 'Escape') {
        if (editingTask !== null) { setEditingTask(null); return; }
        if (showSuggestModal) { setShowSuggestModal(false); return; }
        if (showReviewMode) { setShowReviewMode(false); return; }

        if (showNewConfirm) { setShowNewConfirm(false); return; }
        if (teamExpandedCell) { setTeamExpandedCell(null); return; }

      }

      // Ctrl+S / Cmd+S always works
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        if (data) handleSaveRef.current();
        return;
      }

      if (inField) return;

      if (e.key === 'n' || e.key === '/') {
        e.preventDefault();
        quickAddInputRef.current?.focus();
      } else if (e.key === '1') {
        setViewMode('week'); setShowReviewMode(false);

      } else if (e.key === '3') {

      try {
        const parsed = jsyaml.load(e.target.result);
        if (!parsed || typeof parsed !== 'object') throw new Error("Empty or invalid YAML");
        const loaded = {
          meta: {
            created: parsed.meta?.created || todayStr(),

          projects: (parsed.projects || []).map(p => ({
            id: p.id || '',

            status: p.status || 'active',
            target_date: p.target_date || null,
            notes: p.notes || ''

          tasks: (parsed.tasks || []).map(t => ({
            id: t.id || nextTaskId(parsed.tasks || []),

            project: t.project || null,
            status: t.status || 'open',

            delegated_by: t.delegated_by || null,
            delegation_date: t.delegation_date || null

        };
        // Check if this is a delegation batch — merge into existing data instead of replacing
        if (parsed.meta?.delegation_batch && data) {
          const existingIds = new Set(data.tasks.map(t => t.id));
          const existingProjIds = new Set(data.projects.map(p => p.id));
          const newTasks = loaded.tasks.filter(t => !existingIds.has(t.id));
          const updatedTasks = loaded.tasks.filter(t => existingIds.has(t.id));
          const newProjects = loaded.projects.filter(p => !existingProjIds.has(p.id));
          const merged = mergeDelegationBatch(data, loaded);
          setData(merged);
          setDirty(true);
          setError("");
          const parts = [];
          if (newTasks.length > 0) parts.push(`${newTasks.length} new task${newTasks.length > 1 ? 's' : ''}`);
          if (updatedTasks.length > 0) parts.push(`${updatedTasks.length} updated`);
          if (newProjects.length > 0) parts.push(`${newProjects.length} new project${newProjects.length > 1 ? 's' : ''}`);
          const summary = parts.length > 0 ? parts.join(', ') : 'no changes';
          showToast(`Imported from ${file.name}: ${summary}`);
        } else {
          setData(loaded);
          setOriginalFilename(file.name);
          setDirty(false);
          setError("");
          if (loaded.tasks.some(t => t.week === currentISOWeek())) {
            setSelectedWeek(currentISOWeek());
          }
          showToast(`Loaded: ${file.name}`);
        }
      } catch (err) {
        setError(`Failed to parse YAML: ${err.message}`);
      }

  const allWeeks = useMemo(() => {

  const applyFilters = useCallback((tasks) => {

    if (filterContext !== "all") result = result.filter(t => (t.context || 'work') === filterContext);
    if (filterPriority !== "all") result = result.filter(t => t.priority === filterPriority);
    if (filterDue !== 'all') {

        const soon = new Date(today + 'T00:00:00');

        const soonStr = localDateStr(soon);
        result = result.filter(t => t.due && t.due >= today && t.due <= soonStr && t.status !== 'done' && t.status !== 'deferred' && t.status !== 'thread');
      }

  const weekTasks = useMemo(() => {
    if (!data) return { threads: [], overdue: [], carryover: [], regular: [] };
    let tasks;
    // When a Due filter is active (overdue/soon/thisweek), search across ALL tasks
    // not just the current planned week — these are urgent-visibility filters
    if (filterDue !== 'all') {
      tasks = data.tasks.filter(t => t.status !== 'done' && t.status !== 'deferred' && t.status !== 'thread');
      tasks = applyFilters(tasks);
      return { threads: [], overdue: [], regular: sortTasks(tasks), carryover: [] };
    } else if (weekViewMode === 'due') {
      tasks = data.tasks.filter(t => t.due && weekContainsDate(selectedWeek, t.due) && t.status !== 'done' && t.status !== 'deferred' && t.status !== 'thread');
      tasks = applyFilters(tasks);
      return { threads: [], overdue: [], regular: sortTasks(tasks), carryover: [] };
    } else {
      // Planned mode
      // Threads: ALL non-done thread-status tasks regardless of week (F1)
      const threadTasks = data.tasks.filter(t => t.status === 'thread');
      // Carryover statuses (open/in_progress/blocked) — used for carryover and overdue
      const activeStatuses = ['open', 'in_progress', 'blocked'];
      // Overdue: ALL overdue tasks regardless of planned week (matches HUD global count)
      // Overdue takes priority over carryover and regular placement
      const overdueTasks = data.tasks.filter(t =>

      );
      const overdueIds = new Set(overdueTasks.map(t => t.id));
      // Carryover: tasks from prior weeks, non-overdue, non-thread, status active
      const carryoverTasks = data.tasks.filter(t =>
        t.week && t.week < selectedWeek && activeStatuses.includes(t.status) && !overdueIds.has(t.id)
      );
      // Regular: tasks for this week, NOT overdue, NOT thread
      const regularTasks = data.tasks.filter(t =>
        t.week === selectedWeek && t.status !== 'thread' && !overdueIds.has(t.id)
      );
      return {
        threads: sortTasks(applyFilters(threadTasks)),
        overdue: sortTasks(applyFilters(overdueTasks)),
        carryover: sortTasks(applyFilters(carryoverTasks)),
        regular: sortTasks(applyFilters(regularTasks))
      };
    }
  }, [data, selectedWeek, applyFilters, weekViewMode, filterDue]);

  const projectTasks = useMemo(() => {
    if (!data) return {};
    const groups = {};
    for (const p of data.projects) {
      groups[p.id] = sortTasks(applyFilters(data.tasks.filter(t => t.project === p.id)));
    }
    groups['__none__'] = sortTasks(applyFilters(data.tasks.filter(t => !t.project)));
    return groups;
  }, [data, applyFilters]);

  // ===== Project collapse helpers (must be after projectTasks) =====
  const toggleProjectCollapse = useCallback((projectId) => {
    setCollapsedProjects(prev => {
      const next = { ...prev };
      if (next[projectId]) {
        delete next[projectId];
      } else {
        next[projectId] = true;
      }
      return next;
    });
  }, []);

  const isProjectCollapsed = useCallback((projectId) => !!collapsedProjects[projectId], [collapsedProjects]);

  const allProjectsCollapsed = useMemo(() => {
    if (!data || data.projects.length === 0) return false;
    const allIds = [...data.projects.map(p => p.id)];
    if (projectTasks['__none__'] && projectTasks['__none__'].length > 0) allIds.push('__none__');
    return allIds.length > 0 && allIds.every(id => collapsedProjects[id]);
  }, [data, collapsedProjects, projectTasks]);

  const toggleAllProjectsCollapse = useCallback(() => {
    if (!data) return;
    if (allProjectsCollapsed) {
      setCollapsedProjects({});
    } else {
      const allIds = [...data.projects.map(p => p.id)];
      if (projectTasks['__none__'] && projectTasks['__none__'].length > 0) allIds.push('__none__');
      const next = {};
      allIds.forEach(id => { next[id] = true; });
      setCollapsedProjects(next);
    }
  }, [data, allProjectsCollapsed, projectTasks]);

  const weekStats = useMemo(() => {
    if (!data) return { open: 0, done: 0, blocked: 0, total: 0 };
    let tasks;
    if (weekViewMode === 'due') {
      tasks = data.tasks.filter(t => t.due && weekContainsDate(selectedWeek, t.due));
    } else {
      tasks = data.tasks.filter(t => t.week === selectedWeek);
    }
    return {
      open: tasks.filter(t => t.status === 'open' || t.status === 'in_progress').length,
      done: tasks.filter(t => t.status === 'done').length,
      blocked: tasks.filter(t => t.status === 'blocked').length,
      total: tasks.length
    };
  }, [data, selectedWeek, weekViewMode]);

  const globalStats = useMemo(() => {
    if (!data) return { total: 0, open: 0, done: 0, blocked: 0, overdue: 0, stale: 0, deferred: 0, threads: 0 };
    const tasks = data.tasks;
    return {
      total: tasks.length,
      open: tasks.filter(t => t.status === 'open' || t.status === 'in_progress').length,
      done: tasks.filter(t => t.status === 'done').length,
      blocked: tasks.filter(t => t.status === 'blocked').length,
      overdue: tasks.filter(t => isOverdue(t)).length,
      stale: tasks.filter(t => isStale(t)).length,
      deferred: tasks.filter(t => t.status === 'deferred').length,
      threads: tasks.filter(t => t.status === 'thread').length
    };
  }, [data]);

  // ===== HUD stats (F7) — combines weekStats and globalStats =====
  const hudStats = useMemo(() => {
    if (!data) return { week: selectedWeek || currentISOWeek(), total: 0, open: 0, closed: 0, overdue: 0, threads: 0 };
    const cw = selectedWeek;
    // Tasks for this week (planned mode)
    const weekTasksList = data.tasks.filter(t => t.week === cw);
    const open = weekTasksList.filter(t => t.status === 'open' || t.status === 'in_progress').length;
    // Closed: tasks where week_completed === cw OR (status done AND no week_completed AND week === cw) — handles mixed old/new data
    const closed = data.tasks.filter(t => (t.week_completed === cw) || (t.status === 'done' && (t.week_completed === undefined || t.week_completed === null) && t.week === cw)).length;
    // Overdue: global (all weeks, not just current)
    const overdue = data.tasks.filter(t => isOverdue(t)).length;
    // Threads: global (all weeks)
    const threads = data.tasks.filter(t => t.status === 'thread').length;
    return {
      week: cw,
      total: weekTasksList.length,
      open,
      closed,
      overdue,
      threads
    };
  }, [data, selectedWeek]);

  // ===== "What can I do now?" suggestions =====
  const suggestions = useMemo(() => {
    if (!data) return [];
    let candidates = data.tasks.filter(t =>
      t.status === 'open' || t.status === 'in_progress'
    );
    if (suggestEnergy !== 'all') {
      candidates = candidates.filter(t => t.energy === suggestEnergy);
    }
    candidates.sort((a, b) => {
      const aOver = isOverdue(a) ? 0 : 1;
      const bOver = isOverdue(b) ? 0 : 1;
      if (aOver !== bOver) return aOver - bOver;
      const pa = PRIORITY_ORDER[a.priority] ?? 3;
      const pb = PRIORITY_ORDER[b.priority] ?? 3;
      if (pa !== pb) return pa - pb;
      if (a.due && b.due) return a.due.localeCompare(b.due);
      if (a.due) return -1;
      if (b.due) return 1;
      return 0;
    });
    return candidates.slice(0, 5);
  }, [data, suggestEnergy]);

  // ===== Weekly review data =====
  const reviewData = useMemo(() => {
    if (!data) return { stale: [], unassigned: [], blocked: [], doneThisWeek: [] };
    const tasks = data.tasks;
    return {
      stale: tasks.filter(t => isStale(t)),
      unassigned: tasks.filter(t => !t.week && (t.status === 'open' || t.status === 'in_progress')),
      blocked: tasks.filter(t => t.status === 'blocked'),
      doneThisWeek: tasks.filter(t => t.status === 'done' && t.week === currentISOWeek())
    };
  }, [data]);

  // ===== Brag log export =====
  const bragExportText = useMemo(() => {
    if (!data) return '';
    const done = data.tasks.filter(t => t.status === 'done' && t.week === currentISOWeek());
    if (done.length === 0) return '(No completed tasks this week)';
    return done.map(t => `- [${t.id}] ${t.title}`).join('\n');
  }, [data]);

  // ===== Brag copy =====
  const copyBragToClipboard = useCallback(() => {
    navigator.clipboard?.writeText(bragExportText).then(() => {
      showToast("Brag log copied to clipboard");
    }).catch(() => {
      showToast("Copy failed — select and copy manually");
    });
  }, [bragExportText, showToast]);

  // ===== Render: localStorage restore prompt =====
  if (showRestorePrompt && !data) {
    return (
      <div className={`app theme-${theme}`}>
        <div className="empty-state">
          <h2>Task Manager</h2>
          <p>Found unsaved data in your browser from a previous session.</p>
          <div className="btn-group">
            <button className="btn btn-primary" onClick={handleRestoreLS}>Restore Previous Session</button>
            <button className="btn" onClick={() => setShowRestorePrompt(false)}>Start Fresh</button>
            <button className="btn" onClick={() => fileInputRef.current?.click()}>Load from File</button>
          </div>
        </div>
        <input type="file" ref={fileInputRef} style={{display:'none'}}
          accept=".yaml,.yml" onChange={handleFilePick} />
      </div>
    );
  }

  // ===== Render: no data =====
  if (!data) {
    return (
      <div className={`app theme-${theme}`}
        onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}
      >
        <div className="empty-state">
          <h2>Task Manager</h2>
          <p>A personal task manager for ADHD brains. Capture tasks fast, see what's overdue, and figure out what to do next — even when you're fried.</p>
          <div className="btn-group">
            <button className="btn btn-primary" onClick={() => { setData(blankData()); setDirty(true); }}>New Task List</button>
            <button className="btn" onClick={() => fileInputRef.current?.click()}>Load YAML</button>
          </div>
          <div className={"drop-zone" + (dragOver ? " dragover" : "")}
            onClick={() => fileInputRef.current?.click()}>
            <p>Drop a .yaml file here or click to browse</p>
          </div>
          <input type="file" ref={fileInputRef} style={{display:'none'}}
            accept=".yaml,.yml" onChange={handleFilePick} />
        </div>
        {error && <div className="error-msg">{error}</div>}
        {toast && <div className="toast">{toast}{toastAction && <button onClick={toastAction.fn}>Undo</button>}</div>}
      </div>
    );
  }

  // ===== Render: main app =====
  return (
    <div className={`app theme-${theme}`}
      onDragOver={viewMode === 'team' ? handleTeamDragOver : handleDragOver}
      onDragLeave={viewMode === 'team' ? handleTeamDragLeave : handleDragLeave}
      onDrop={viewMode === 'team' ? handleTeamDrop : handleDrop}
    >
      {/* Header */}
      <div className="header">
        <h1>Task Manager</h1>
        <div className="header-actions">
          {dirty && <span className="dirty-badge">Unsaved</span>}
          <button className="btn btn-desktop-only" onClick={() => fileInputRef.current?.click()}>Load</button>
          <button className="btn btn-desktop-only" onClick={handleNew}>New</button>
          <button className="btn btn-desktop-only" onClick={() => setShowReviewMode(true)}>Review</button>
          <button className="btn" onClick={() => setShowSuggestModal(true)}>What Now?</button>
          <button className="btn btn-small btn-theme" onClick={() => setTheme(t => t === 'industrial' ? 'matrix' : 'industrial')}
            title={theme === 'industrial' ? 'Switch to Matrix theme' : 'Switch to Industrial Workshop theme'}>
            {theme === 'industrial' ? '◐' : '◑'}
          </button>
          <button className="btn btn-small btn-desktop-only" onClick={() => { setSettingsOwner(data.meta?.owner || ''); setSettingsCapacity(data.meta?.weekly_capacity_hours || 40); setShowSettingsModal(true); }}
            title="Settings: owner name and weekly capacity">
            ⚙
          </button>
          <button className={"btn btn-primary" + (showSettingsModal || showSuggestModal || showNewConfirm ? " btn-disabled" : "")}
            onClick={handleSave}
            disabled={showSettingsModal || showSuggestModal || showNewConfirm}>Save</button>
          {/* Mobile overflow menu */}
          <div style={{position:'relative'}} className="btn-mobile-only">
            <button className="btn btn-small" onClick={() => setShowMobileMenu(v => !v)} title="More">⋮</button>
            <div className={"more-menu-dropdown" + (showMobileMenu ? " open" : "")}>
              <button className="btn" onClick={() => { setShowMobileMenu(false); fileInputRef.current?.click(); }}>Load</button>
              <button className="btn" onClick={() => { setShowMobileMenu(false); handleNew(); }}>New</button>
              <button className="btn" onClick={() => { setShowMobileMenu(false); setShowReviewMode(true); }}>Review</button>
              <button className="btn" onClick={() => { setShowMobileMenu(false); setSettingsOwner(data.meta?.owner || ''); setSettingsCapacity(data.meta?.weekly_capacity_hours || 40); setShowSettingsModal(true); }}>Settings</button>
            </div>
          </div>
        </div>
      </div>

      {error && <div className="error-msg">{error}</div>}

      {/* Stats Bar */}
      <div className="stats-bar">
        <span className="stat-item"><span className="stat-dot" style={{background:'var(--accent)'}}></span> {globalStats.open} open</span>
        <span className="stat-item"><span className="stat-dot" style={{background:'var(--green)'}}></span> {globalStats.done} done</span>
        <span className="stat-item"><span className="stat-dot" style={{background:'var(--red)'}}></span> {globalStats.blocked} blocked</span>
        {globalStats.overdue > 0 && <span className="stat-item"><span className="stat-dot" style={{background:'var(--red)'}}></span> {globalStats.overdue} overdue</span>}
        {globalStats.stale > 0 && <span className="stat-item"><span className="stat-dot" style={{background:'var(--orange)'}}></span> {globalStats.stale} stale</span>}
        {globalStats.deferred > 0 && <span className="stat-item"><span className="stat-dot" style={{background:'var(--ink-muted)'}}></span> {globalStats.deferred} deferred</span>}
        {globalStats.threads > 0 && <span className="stat-item"><span className="stat-dot" style={{background:'var(--purple)'}}></span> {globalStats.threads} threads</span>}
        <span className="stat-item" style={{marginLeft:'auto', color:'var(--ink-muted)'}}>{globalStats.total} total tasks</span>
      </div>

      {/* Review Mode */}
      {showReviewMode ? (
        <ReviewMode
          reviewData={reviewData}
          data={data}
          allWeeks={allWeeks}
          selectedWeek={selectedWeek}
          bragExportText={bragExportText}
          copyBragToClipboard={copyBragToClipboard}
          toggleTaskDone={toggleTaskDone}
          deleteTask={deleteTask}
          updateTask={updateTask}
          updateData={updateData}
          setShowReviewMode={setShowReviewMode}
          showToast={showToast}
        />
      ) : (
        <>
          {/* Quick Add — hidden in team and delegated mode */}
          {viewMode !== 'team' && viewMode !== 'delegated' && (
          <>
          <div className="quick-add">
            <div className="quick-add-row">
            <div className="quick-add-field quick-add-task-field">
              <label className="quick-add-label">TASK</label>
              <input type="text" ref={quickAddInputRef}
                placeholder="Type a task... !high @project #low due fri"
                value={quickTitle}
                onChange={e => setQuickTitle(e.target.value)}
                onKeyDown={e => {
                  if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    handleQuickAdd(false);
                  } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    handleQuickAdd(true);
                  }
                }}
              />
            </div>
            <div className="quick-add-field">
              <label className="quick-add-label">PROJECT</label>
              <select value={quickProject} onChange={e => setQuickProject(e.target.value)}>
                <option value="">No project</option>
                {sortedProjects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <div className="quick-add-field">
              <label className="quick-add-label">PRIORITY</label>
              <select value={quickPriority} onChange={e => setQuickPriority(e.target.value)}>
                {Object.entries(PRIORITY_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div className="quick-add-field">
              <label className="quick-add-label">ENERGY</label>
              <select value={quickEnergy} onChange={e => setQuickEnergy(e.target.value)}>
                {Object.entries(ENERGY_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            </div>
            <div className="quick-add-row">
            <div className="quick-add-field">
              <label className="quick-add-label">STATUS</label>
              <select value={quickStatus} onChange={e => setQuickStatus(e.target.value)}>
                {Object.entries(STATUS_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div className="quick-add-field">
              <label className="quick-add-label">DUE</label>
              <input type="date" value={quickDue} onChange={e => setQuickDue(e.target.value)} title="Due date" />
            </div>
            <div className="quick-add-field">
              <label className="quick-add-label">PLANNED</label>
              <select value={quickWeek} onChange={e => setQuickWeek(e.target.value)}>
                {allWeeks.map(w => <option key={w} value={w}>{w}</option>)}
              </select>
            </div>
            <div className="quick-add-field">
              <label className="quick-add-label">ESTIMATE</label>
              <input type="text" value={quickEstimate}
                onChange={e => setQuickEstimate(e.target.value)}
                placeholder="e.g. 30m"
                style={{width: '80px', padding: '9px 12px', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', fontSize: '0.82rem', fontFamily: 'var(--font-sans)', color: 'var(--ink-secondary)', background: 'var(--surface-tint)'}} />
            </div>
            </div>
            <div className="quick-add-field quick-add-notes">
              <label className="quick-add-label">NOTES</label>
              <input type="text"
                placeholder="Notes (optional)..."
                value={quickNotes}
                onChange={e => setQuickNotes(e.target.value)}
                onKeyDown={e => {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    handleQuickAdd(false);
                  }
                }}
              />
            </div>
            <div className="quick-add-buttons">
              <button className="btn btn-primary" onClick={() => handleQuickAdd(false)}>+ Add</button>
              <button className="btn btn-primary" onClick={() => fileInputRef.current?.click()}
                title="Import a delegation YAML file from your manager">Import Delegations</button>
            </div>
          </div>
          <div className="quick-add-hint">
            Type a task and press Enter. Add !high for priority, @project for project, #low for energy, ~30m for estimate, due fri for due date.
            <span className="quick-add-badge">Planned: {quickWeek}</span>
          </div>
          </>
          )}

          {/* View Tabs */}
          <div className="view-tabs">
            <div className={"view-tab" + (viewMode === "week" ? " active" : "")} onClick={() => setViewMode("week")}>Planned</div>
            <div className={"view-tab" + (viewMode === "project" ? " active" : "")} onClick={() => setViewMode("project")}>Project</div>
            <div className={"view-tab" + (viewMode === "delegated" ? " active" : "")} onClick={() => setViewMode("delegated")}>Delegated</div>
            <div className={"view-tab" + (viewMode === "team" ? " active" : "")} onClick={() => setViewMode("team")}>Team</div>
          </div>

          {/* Filters — hidden in team and delegated mode */}
          {viewMode !== 'team' && viewMode !== 'delegated' && (
          <div className="filter-bar">
            <label>Energy:</label>
            <select value={filterEnergy} onChange={e => setFilterEnergy(e.target.value)}>
              <option value="all">All</option>
              <option value="low">LOW</option>
              <option value="medium">MED</option>
              <option value="high">HIGH</option>
            </select>
            <label>Status:</label>
            <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
              <option value="all">All</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
              <option value="blocked">Blocked</option>
              <option value="deferred">Deferred</option>
              <option value="thread">Thread</option>
            </select>
            <label>Context:</label>
            <select value={filterContext} onChange={e => setFilterContext(e.target.value)}>
              <option value="all">All</option>
              {Object.entries(CONTEXT_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
            <label>Priority:</label>
            <select value={filterPriority} onChange={e => setFilterPriority(e.target.value)}>
              <option value="all">All</option>
              {Object.entries(PRIORITY_LABELS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </select>
            <label>Due:</label>
            <select value={filterDue} onChange={e => setFilterDue(e.target.value)}>
              <option value="all">All</option>
              <option value="overdue">Overdue</option>
              <option value="soon">Due soon (3 days)</option>
              <option value="thisweek">Due this week</option>
            </select>
            <div className="filter-spacer"></div>
            <button className="btn btn-small" onClick={() => { setFilterEnergy('all'); setFilterStatus('all'); setFilterContext('all'); setFilterPriority('all'); setFilterDue('all'); }}>Clear</button>
          </div>
          )}

          {/* Week View */}
          {viewMode === "week" && (
            <>
              <div className="week-nav">
                <button className="week-nav-btn" onClick={() => setSelectedWeek(shiftWeek(selectedWeek, -1))}>←</button>
                <h2 className={selectedWeek === currentISOWeek() ? "week-nav-current" : ""}>Planned: {selectedWeek}</h2>
                <button className="week-nav-btn" onClick={() => setSelectedWeek(shiftWeek(selectedWeek, 1))}>→</button>
                <select value={selectedWeek} onChange={e => setSelectedWeek(e.target.value)}>
                  {allWeeks.map(w => (
                    <option key={w} value={w}>
                      {w} ({weekToDateRange(w)}){w === currentISOWeek() ? ' ← current' : ''}
                    </option>
                  ))}
                </select>
                <button className="btn btn-small" onClick={() => setSelectedWeek(currentISOWeek())}>Today</button>
                <button className={"btn btn-small" + (weekViewMode === 'due' ? " btn-primary" : "")}
                  onClick={() => setWeekViewMode(m => m === 'planned' ? 'due' : 'planned')}
                  title="Toggle between planned-week view and due-this-week view">
                  {weekViewMode === 'planned' ? 'Show Due This Week' : 'Show Planned'}
                </button>
                <div className="week-stats">
                  <span className="week-stat"><span className="week-stat-dot" style={{background:'var(--accent)'}}></span> {weekStats.open} open</span>
                  <span className="week-stat"><span className="week-stat-dot" style={{background:'var(--green)'}}></span> {weekStats.done} done</span>
                  <span className="week-stat"><span className="week-stat-dot" style={{background:'var(--red)'}}></span> {weekStats.blocked} blocked</span>
                </div>
              </div>

              {(weekTasks.regular.length === 0 && weekTasks.carryover.length === 0 && weekTasks.threads.length === 0 && weekTasks.overdue.length === 0) ? (
                <div style={{textAlign:'center', padding:'40px', color:'var(--ink-muted)'}}>
                  {weekViewMode === 'planned'
                    ? `No tasks planned for ${selectedWeek}. Add one above or switch weeks.`
                    : `No tasks due during ${selectedWeek}.`}
                </div>
              ) : (
                <>
                  {weekViewMode === 'planned' && weekTasks.threads.length > 0 && (
                    <div className="threads-section">
                      <div className="threads-header">
                        Threads
                        <span className="threads-count">{weekTasks.threads.length}</span>
                      </div>
                      {weekTasks.threads.map(t => (
                        <TaskCard key={t.id} task={t} data={data} editingTask={editingTask}
                          setEditingTask={setEditingTask} toggleTaskDone={toggleTaskDone}
                          deleteTask={deleteTask} updateTask={updateTask} allWeeks={allWeeks}
                          knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode={viewMode} showToast={showToast}
                          isThread={true}
                        />
                      ))}
                    </div>
                  )}
                  {weekViewMode === 'planned' && weekTasks.overdue.length > 0 && (
                    <div className="overdue-section">
                      <div className="overdue-header">
                        Overdue
                        <span className="overdue-count">{weekTasks.overdue.length}</span>
                      </div>
                      {weekTasks.overdue.map(t => (
                        <TaskCard key={t.id} task={t} data={data} editingTask={editingTask}
                          setEditingTask={setEditingTask} toggleTaskDone={toggleTaskDone}
                          deleteTask={deleteTask} updateTask={updateTask} allWeeks={allWeeks}
                          knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode={viewMode} showToast={showToast}
                          isCarryover={t.week < selectedWeek}
                        />
                      ))}
                    </div>
                  )}
                  {weekViewMode === 'planned' && weekTasks.carryover.length > 0 && (
                    <div className="carryover-section">
                      <div className="carryover-header">
                        Carryover from prior weeks
                        <span className="carryover-count">{weekTasks.carryover.length}</span>
                      </div>
                      {weekTasks.carryover.map(t => (
                        <TaskCard key={t.id} task={t} data={data} editingTask={editingTask}
                          setEditingTask={setEditingTask} toggleTaskDone={toggleTaskDone}
                          deleteTask={deleteTask} updateTask={updateTask} allWeeks={allWeeks}
                          knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode={viewMode} showToast={showToast}
                          isCarryover={true}
                        />
                      ))}
                    </div>
                  )}
                  {weekTasks.regular.map(t => (
                    <TaskCard key={t.id} task={t} data={data} editingTask={editingTask}
                      setEditingTask={setEditingTask} toggleTaskDone={toggleTaskDone}
                      deleteTask={deleteTask} updateTask={updateTask} allWeeks={allWeeks}
                      knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode={viewMode} showToast={showToast}
                    />
                  ))}
                </>
              )}
            </>
          )}

          {/* Project View */}
          {viewMode === "project" && (
            <>
              {/* Add Project button/form + Collapse All */}
              {!showAddProject ? (
                <div style={{display:'flex', gap:8, marginBottom:12}}>
                  <button className="btn btn-small project-add-btn" onClick={() => setShowAddProject(true)}>+ Add Project</button>
                  {data.projects.length > 0 && (
                    <button className="btn btn-small project-collapse-all-btn" onClick={toggleAllProjectsCollapse}>
                      {allProjectsCollapsed ? 'Expand All' : 'Collapse All'}
                    </button>
                  )}
                </div>
              ) : (
                <div className="add-project-form">
                  <input type="text" placeholder="Project ID (e.g. my-project)" value={newProjectId}
                    onChange={e => setNewProjectId(e.target.value)} autoFocus
                    onKeyDown={e => e.key === 'Enter' && addProject(newProjectId, newProjectName)} />
                  <input type="text" placeholder="Project name" value={newProjectName}
                    onChange={e => setNewProjectName(e.target.value)} style={{flex: 1, minWidth: 150}}
                    onKeyDown={e => e.key === 'Enter' && addProject(newProjectId, newProjectName)} />
                  <button className="btn btn-primary btn-small" onClick={() => addProject(newProjectId, newProjectName)}>Add</button>
                  <button className="btn btn-small" onClick={() => { setShowAddProject(false); setNewProjectId(""); setNewProjectName(""); }}>Cancel</button>
                </div>
              )}

              {data.projects.length === 0 && (!projectTasks['__none__'] || projectTasks['__none__'].length === 0) ? (
                <div className="project-no-project">
                  <p>No projects yet. Use the Add Project button above or type @project-slug in the quick-add bar.</p>
                </div>
              ) : (
                <>
                  {sortedProjects.map(p => {
                    const tasks = projectTasks[p.id] || [];
                    const open = tasks.filter(t => t.status !== 'done' && t.status !== 'deferred').length;
                    const blocked = tasks.filter(t => t.status === 'blocked').length;
                    const collapsed = isProjectCollapsed(p.id) && editingProject !== p.id;
                    return (
                      <div key={p.id} className="project-section">
                        <div className="project-header">
                          <h2 onClick={() => toggleProjectCollapse(p.id)}>
                            <span className="project-chevron">{collapsed ? '▸' : '▾'}</span>
                            {p.name}{p.status && p.status !== 'active' && <span className="project-status-badge">{p.status === 'on-hold' ? 'On Hold' : p.status}</span>}
                          </h2>
                          <div className="project-stats">
                            {open} open · {blocked} blocked
                            {p.target_date && ` · target ${p.target_date}`}
                            <button className="btn btn-small" style={{marginLeft: 8, padding: '2px 8px'}} onClick={() => { startEditProject(p); if (isProjectCollapsed(p.id)) toggleProjectCollapse(p.id); }}>✎ Edit</button>
                          </div>
                        </div>
                        {editingProject === p.id ? (
                          <div className="add-project-form" style={{flexDirection: 'column', gap: 8}}>
                            <div style={{display: 'flex', gap: 8}}>
                              <input type="text" placeholder="Project name" value={editProjName}
                                onChange={e => setEditProjName(e.target.value)} style={{flex: 1}} autoFocus />
                              <select value={editProjStatus} onChange={e => setEditProjStatus(e.target.value)}>
                                <option value="active">Active</option>
                                <option value="on-hold">On Hold</option>
                                <option value="done">Done</option>
                              </select>
                            </div>
                            <div style={{display: 'flex', gap: 8}}>
                              <label style={{fontSize: '0.75rem', fontWeight: 600, color: 'var(--ink-muted)'}}>TARGET DATE</label>
                              <input type="date" value={editProjTarget} onChange={e => setEditProjTarget(e.target.value)} />
                            </div>
                            <textarea placeholder="Project notes..." value={editProjNotes}
                              onChange={e => setEditProjNotes(e.target.value)} rows={2}
                              style={{width: '100%', resize: 'vertical'}} />
                            <div style={{display: 'flex', gap: 8}}>
                              <button className="btn btn-primary btn-small" onClick={saveEditProject}>Save</button>
                              <button className="btn btn-small" onClick={() => setEditingProject(null)}>Cancel</button>
                            </div>
                          </div>
                        ) : (
                          p.notes && !collapsed && <div className="project-notes-display">{p.notes}</div>
                        )}
                        {!collapsed && (
                          tasks.length === 0 ? (
                            <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>No tasks in this project.</p>
                          ) : (
                            tasks.map(t => (
                              <TaskCard key={t.id} task={t} data={data} editingTask={editingTask}
                                setEditingTask={setEditingTask} toggleTaskDone={toggleTaskDone}
                                deleteTask={deleteTask} updateTask={updateTask} allWeeks={allWeeks}
                    knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode={viewMode} showToast={showToast}
                              />
                            ))
                          )
                        )}
                      </div>
                    );
                  })}
                  {projectTasks['__none__'] && projectTasks['__none__'].length > 0 && (
                    <div className="project-section">
                      <div className="project-header">
                        <h2 onClick={() => toggleProjectCollapse('__none__')}>
                          <span className="project-chevron">{isProjectCollapsed('__none__') ? '▸' : '▾'}</span>
                          Unassigned
                        </h2>
                        <div className="project-stats">{projectTasks['__none__'].length} tasks</div>
                      </div>
                      {!isProjectCollapsed('__none__') && projectTasks['__none__'].map(t => (
                        <TaskCard key={t.id} task={t} data={data} editingTask={editingTask}
                          setEditingTask={setEditingTask} toggleTaskDone={toggleTaskDone}
                          deleteTask={deleteTask} updateTask={updateTask} allWeeks={allWeeks}
                    knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode={viewMode} showToast={showToast}
                        />
                      ))}
                    </div>
                  )}
                </>
              )}
            </>
          )}

          {/* Delegated View */}
          {viewMode === "delegated" && (
            <DelegatedView
              data={data}
              editingTask={editingTask}
              setEditingTask={setEditingTask}
              toggleTaskDone={toggleTaskDone}
              deleteTask={deleteTask}
              updateTask={updateTask}
              allWeeks={allWeeks}
              knownEngineers={knownEngineers}
              delegateTask={delegateTask}
              undelegateTask={undelegateTask}
              exportDelegations={exportDelegations}
              setViewMode={setViewMode}
              setSelectedWeek={setSelectedWeek}
              showToast={showToast}
            />
          )}

          {/* Team View */}
          {viewMode === "team" && (
            <TeamView
              teamData={teamData}
              teamWeekStart={teamWeekStart}
              setTeamWeekStart={setTeamWeekStart}
              teamSubView={teamSubView}
              setTeamSubView={setTeamSubView}
              teamDragOver={teamDragOver}
              handleTeamDragOver={handleTeamDragOver}
              handleTeamDragLeave={handleTeamDragLeave}
              handleTeamDrop={handleTeamDrop}
              teamFileInputRef={teamFileInputRef}
              handleTeamFilePick={handleTeamFilePick}
              removeEngineer={removeEngineer}
              refreshTeam={refreshTeam}
              teamWeeks={teamWeeks}
              workloadData={workloadData}
              cellColorClass={cellColorClass}
              teamExpandedCell={teamExpandedCell}
              setTeamExpandedCell={setTeamExpandedCell}
              teamPriorityData={teamPriorityData}
              teamReviewData={teamReviewData}
              currentWeek={currentISOWeek()}
              onJumpToTask={(task) => {
                if (task.week) setSelectedWeek(task.week);
                setViewMode('week');
                setEditingTask(task.id);
              }}
            />
          )}
        </>
      )}

      {/* Suggest Modal */}
      {showSuggestModal && (
        <div className="modal-overlay" onClick={(e) => { if (e.target.className === 'modal-overlay') setShowSuggestModal(false); }}>
          <div className="modal">
            <h3>What Can I Do Right Now?</h3>
            <p className="modal-desc">Top 5 tasks by priority and urgency. Pick one and go.</p>
            <div className="energy-buttons">
              <button className={"energy-btn" + (suggestEnergy === 'all' ? " active" : "")} onClick={() => setSuggestEnergy('all')}>All</button>
              <button className={"energy-btn" + (suggestEnergy === 'high' ? " active" : "")} onClick={() => setSuggestEnergy('high')}>I'm fresh</button>
              <button className={"energy-btn" + (suggestEnergy === 'medium' ? " active" : "")} onClick={() => setSuggestEnergy('medium')}>Medium</button>
              <button className={"energy-btn" + (suggestEnergy === 'low' ? " active" : "")} onClick={() => setSuggestEnergy('low')}>I'm fried</button>
            </div>
            {suggestions.length === 0 ? (
              <div className="suggestion-empty">No open tasks matching that energy level.</div>
            ) : (
              suggestions.map(t => (
                <div key={t.id} className={"suggestion-card" + (isOverdue(t) ? " overdue" : "")} onClick={() => {
                  setShowSuggestModal(false);
                  if (t.week) setSelectedWeek(t.week);
                  setViewMode("week");
                  setShowReviewMode(false);
                  setEditingTask(t.id);
                }}>
                  <div className="suggestion-title">{t.title}</div>
                  <div className="suggestion-meta">
                    PRIO: {PRIORITY_LABELS[t.priority]} | ENERGY: {ENERGY_LABELS[t.energy]} | due {t.due || 'none'} | {t.estimate || 'no estimate'}
                    {isOverdue(t) && ' | OVERDUE'}
                  </div>
                </div>
              ))
            )}
            <div className="modal-actions">
              <button className="btn" onClick={() => setShowSuggestModal(false)}>Close</button>
            </div>
          </div>
        </div>
      )}

      {/* Settings Modal */}
      {showSettingsModal && (
        <div className="modal-overlay" onClick={(e) => { if (e.target.className === 'modal-overlay') setShowSettingsModal(false); }}>
          <div className="modal">
            <h3>Settings</h3>
            <p className="modal-desc">Your name appears when your team views your tasks. Weekly capacity is used to flag overloaded weeks in the team workload table.</p>
            <div className="settings-field">
              <label>Owner Name</label>
              <input type="text" value={settingsOwner}
                onChange={e => setSettingsOwner(e.target.value)}
                placeholder="e.g. Jimenez" autoFocus />
            </div>
            <div className="settings-field">
              <label>Weekly Capacity (hours)</label>
              <input type="number" value={settingsCapacity} min="1" max="80"
                onChange={e => setSettingsCapacity(parseInt(e.target.value) || 40)} />
            </div>
            <div className="modal-actions">
              <button className="btn" onClick={() => setShowSettingsModal(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={() => {
                updateData(d => {
                  d.meta.owner = settingsOwner;
                  d.meta.weekly_capacity_hours = settingsCapacity;
                });
                setShowSettingsModal(false);
                showToast("Settings saved");
              }}>Save</button>
            </div>
          </div>
        </div>
      )}

      {/* New Confirm Modal */}
      {showNewConfirm && (
        <div className="modal-overlay" onClick={(e) => { if (e.target.className === 'modal-overlay') setShowNewConfirm(false); }}>
          <div className="modal">
