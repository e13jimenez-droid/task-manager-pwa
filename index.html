            <h3>Start New Task List?</h3>
            <p className="modal-desc">You have unsaved changes. Starting a new list will discard them. Save first if you want to keep your current tasks.</p>
            <div className="modal-actions">
              <button className="btn" onClick={() => setShowNewConfirm(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={() => {
                setShowNewConfirm(false);
                setData(blankData());
                setOriginalFilename("");
                setDirty(true);
                setError("");
                setSelectedWeek(currentISOWeek());
                setViewMode("week");
                setShowReviewMode(false);
                setEditingTask(null);
                showToast("Started new task list");
              }}>Start New</button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div className="toast">
          {toast}
          {toastAction && <button onClick={() => { toastAction.fn(); setToast(""); setToastAction(null); }}>Undo</button>}
        </div>
      )}

      {/* Hidden file input */}
      <input type="file" ref={fileInputRef} style={{display:'none'}}
        accept=".yaml,.yml" onChange={handleFilePick} />
      {/* Hidden team file input (multi-file) */}
      <input type="file" ref={teamFileInputRef} style={{display:'none'}}
        accept=".yaml,.yml" multiple onChange={handleTeamFilePick} />

      {/* Floating Stats HUD (F7) — hidden in Team view */}
      {viewMode !== 'team' && data && (
        <div className={hudCollapsed ? "stats-hud stats-hud-collapsed" : "stats-hud"}>
          <div className="stats-hud-header" onClick={() => setHudCollapsed(!hudCollapsed)}>
            <span className="stats-hud-week">{hudStats.week.split('-')[1]}</span>
            <span className="stats-hud-toggle">{hudCollapsed ? '▸' : '▾'}</span>
          </div>
          {!hudCollapsed && (
            <div className="stats-hud-stats">
              <div className="stats-hud-row"><span className="stats-hud-label">Week</span><span className="stats-hud-val">{hudStats.week}</span></div>
              <div className="stats-hud-row"><span className="stats-hud-label">Total</span><span className="stats-hud-val">{hudStats.total}</span></div>
              <div className="stats-hud-row"><span className="stats-hud-label">Open</span><span className="stats-hud-val">{hudStats.open}</span></div>
              <div className="stats-hud-row"><span className="stats-hud-label">Closed</span><span className="stats-hud-val stats-hud-closed">{hudStats.closed}</span></div>
              <div className="stats-hud-row"><span className="stats-hud-label">Overdue</span><span className="stats-hud-val stats-hud-overdue">{hudStats.overdue}</span></div>
              <div className="stats-hud-row"><span className="stats-hud-label">Threads (all)</span><span className="stats-hud-val stats-hud-threads">{hudStats.threads}</span></div>
            </div>
          )}
        </div>
      )}

      {/* Scroll-to-top button */}
      {showScrollTop && (
        <button className="scroll-top-btn" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          title="Scroll to top">
          ↑
        </button>
      )}

      {/* Mobile Bottom Nav */}
      <div className="bottom-nav">
        <button className={"bottom-nav-btn" + (viewMode === "week" ? " active" : "")} onClick={() => { setViewMode("week"); setShowReviewMode(false); }}>
          <span className="nav-icon">P</span>Planned
        </button>
        <button className={"bottom-nav-btn" + (viewMode === "project" ? " active" : "")} onClick={() => { setViewMode("project"); setShowReviewMode(false); }}>
          <span className="nav-icon">Pr</span>Project
        </button>
        <button className={"bottom-nav-btn" + (viewMode === "delegated" ? " active" : "")} onClick={() => { setViewMode("delegated"); setShowReviewMode(false); }}>
          <span className="nav-icon">D</span>Delegated
        </button>
        <button className={"bottom-nav-btn" + (viewMode === "team" ? " active" : "")} onClick={() => { setViewMode("team"); setShowReviewMode(false); }}>
          <span className="nav-icon">T</span>Team
        </button>
      </div>
    </div>
  );
}

// ===== Delegated View Component =====
function DelegatedView({
  data, editingTask, setEditingTask, toggleTaskDone, deleteTask, updateTask, allWeeks,
  knownEngineers, delegateTask, undelegateTask, exportDelegations,
  setViewMode, setSelectedWeek, showToast
}) {
  const delegatedTasks = data.tasks.filter(t => t.delegated_to);
  const receivedTasks = data.tasks.filter(t => t.delegated_by && !t.delegated_to);

  // Group delegated tasks by engineer
  const byEngineer = {};
  delegatedTasks.forEach(t => {
    if (!byEngineer[t.delegated_to]) byEngineer[t.delegated_to] = [];
    byEngineer[t.delegated_to].push(t);
  });

  return (
    <div className="delegated-container">
      {/* Export section */}
      <div className="delegated-section">
        <h3>Delegation Queue</h3>
        <p className="modal-desc">Tasks you've delegated to your team. Export per-engineer YAML files to send to them.</p>
        {Object.keys(byEngineer).length === 0 && receivedTasks.length === 0 ? (
          <div className="suggestion-empty">
            No delegated tasks. Use the ▸ Edit button on any task to delegate it to an engineer.
          </div>
        ) : (
          <>
            {Object.entries(byEngineer).map(([engineer, tasks]) => (
              <div key={engineer} className="delegated-engineer-group">
                <div className="delegated-engineer-header">
                  <h4>{engineer}</h4>
                  <span className="task-meta-tag tag-project">{tasks.length} tasks</span>
                  <button className="btn btn-small btn-primary"
                    onClick={() => exportDelegations(engineer)}>
                    Export YAML
                  </button>
                </div>
                {tasks.map(t => (
                  <TaskCard key={t.id} task={t} data={data}
                    editingTask={editingTask} setEditingTask={setEditingTask}
                    toggleTaskDone={toggleTaskDone} deleteTask={deleteTask}
                    updateTask={updateTask} allWeeks={allWeeks}
                    knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode="delegated" showToast={showToast}
                  />
                ))}
              </div>
            ))}

            {/* Received tasks (delegated by someone else to you) */}
            {receivedTasks.length > 0 && (
              <div className="delegated-engineer-group">
                <div className="delegated-engineer-header">
                  <h4>Received from Others</h4>
                  <span className="task-meta-tag tag-project">{receivedTasks.length} tasks</span>
                </div>
                {receivedTasks.map(t => (
                  <TaskCard key={t.id} task={t} data={data}
                    editingTask={editingTask} setEditingTask={setEditingTask}
                    toggleTaskDone={toggleTaskDone} deleteTask={deleteTask}
                    updateTask={updateTask} allWeeks={allWeeks}
                    knownEngineers={knownEngineers} delegateTask={delegateTask} undelegateTask={undelegateTask}
                          viewMode="delegated" showToast={showToast}
                  />
                ))}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ===== Team View Component =====
function TeamView({
  teamData, teamWeekStart, setTeamWeekStart, teamSubView, setTeamSubView,
  teamDragOver, handleTeamDragOver, handleTeamDragLeave, handleTeamDrop,
  teamFileInputRef, handleTeamFilePick, removeEngineer, refreshTeam,
  teamWeeks, workloadData, cellColorClass, teamExpandedCell, setTeamExpandedCell,
  teamPriorityData, teamReviewData, currentWeek, onJumpToTask
}) {
  // ===== Empty state =====
  if (teamData.length === 0) {
    return (
      <div className="team-container"
        onDragOver={handleTeamDragOver} onDragLeave={handleTeamDragLeave} onDrop={handleTeamDrop}
      >
        <div className={"team-drop-zone" + (teamDragOver ? " dragover" : "")}
          onClick={() => teamFileInputRef.current?.click()}
        >
          <h2>Team Viewer</h2>
          <p>You haven't loaded any team files yet. Click "Load Team Files" above and select one or more .yaml task files to see everyone's workload at a glance.</p>
          <div className="btn-group">
            <button className="btn btn-primary" onClick={(e) => { e.stopPropagation(); teamFileInputRef.current?.click(); }}>Load Team Files</button>
          </div>
        </div>
        <input type="file" ref={teamFileInputRef} style={{display:'none'}}
          accept=".yaml,.yml" multiple onChange={handleTeamFilePick} />
      </div>
    );
  }

  // ===== Cell click handler (F8: includes subIdx) =====
  const handleCellClick = (engIdx, subIdx, weekIdx, cellData) => {
    if (cellData.count === 0) return;
    const key = `${engIdx}-${subIdx}-${weekIdx}`;
    if (teamExpandedCell && teamExpandedCell.key === key) {
      setTeamExpandedCell(null);
    } else {
      setTeamExpandedCell({ key, engIdx, subIdx, weekIdx });
    }
  };

  // ===== Render workload table =====
  const renderWorkload = () => {
    const cellBgVar = (colorClass) => {
      if (colorClass === 'red-light') return 'var(--red-light)';
      if (colorClass === 'yellow-light') return 'var(--yellow-light)';
      if (colorClass === 'green-light') return 'var(--green-light)';
      return 'transparent';
    };

    return (
      <div>
        {/* Week navigation */}
        <div className="week-nav">
          <button className="week-nav-btn" onClick={() => setTeamWeekStart(shiftWeek(teamWeekStart, -1))}>←</button>
          <h2>{teamWeekStart}</h2>
          <button className="week-nav-btn" onClick={() => setTeamWeekStart(shiftWeek(teamWeekStart, 1))}>→</button>
          <button className="btn btn-small" onClick={() => setTeamWeekStart(shiftWeek(currentISOWeek(), -2))}>Today</button>
        </div>

        {/* Workload table */}
        <table className="workload-table">
          <thead>
            <tr>
              <th className="engineer-col">Engineer</th>
              {teamWeeks.map(wk => (
                <th key={wk} className={wk === currentWeek ? "week-col-current" : ""}>
                  {wk.replace(/^\d{4}-W/, 'W')}<br/>
                  <span style={{fontSize:'0.68rem', fontWeight:400}}>{weekToDateRange(wk)}</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {workloadData.map((wd, engIdx) => (
              <React.Fragment key={wd.owner}>
                {wd.subRows.map((subRow, subIdx) => {
                  const rowKey = `${engIdx}-${subIdx}`;
                  return (
                    <React.Fragment key={rowKey}>
                      <tr className={subRow.isDelegated ? 'workload-sub-row' : ''}>
                        <td className="engineer-col">
                          {subRow.isDelegated ? (
                            <span style={{paddingLeft: 16, color: 'var(--ink-muted)'}}>→ {subRow.delegatedTo}</span>
                          ) : (
                            <>{wd.owner}<br/><span style={{fontSize:'0.68rem', color:'var(--ink-muted)', fontWeight:400}}>{wd.capacity}h cap</span></>
                          )}
                        </td>
                        {subRow.cells.map((cell, weekIdx) => {
                          const colorCls = cellColorClass(cell);
                          const isCurrent = teamWeeks[weekIdx] === currentWeek;
                          const isExpanded = teamExpandedCell && teamExpandedCell.key === `${engIdx}-${subIdx}-${weekIdx}`;
                          const showFlag = cell.highPriorityCount > 2;
                          const isEmpty = cell.totalCount === 0;
                          const displayScore = cell.isPastWeek ? cell.totalScore : cell.score;
                          return (
                            <td key={weekIdx}
                              className={`workload-cell${isEmpty ? ' workload-cell-empty' : ''}${isCurrent ? ' week-col-current' : ''}${cell.isPastWeek ? ' workload-cell-past' : ''}`}
                              style={{ background: cellBgVar(colorCls) }}
                              onClick={() => isEmpty ? null : handleCellClick(engIdx, subIdx, weekIdx, cell)}>
                              {!isEmpty ? (
                                <>
                                  <span className="workload-score" style={cell.isPastWeek && cell.completedCount > 0 ? {color: 'var(--ink-secondary)'} : {}}>{displayScore}</span>
                                  {showFlag && <span className="workload-flag">▲</span>}
                                  <span className="workload-count">
                                    {cell.isPastWeek && cell.completedCount > 0
                                      ? `${cell.count} active + ${cell.completedCount} done`
                                      : `${cell.count} tasks`}
                                  </span>
                                </>
                              ) : (
                                <span style={{color:'var(--ink-faint)'}}>—</span>
                              )}
                            </td>
                          );
                        })}
                      </tr>
                      {/* Drill-down for this sub-row (F8) */}
                      {teamExpandedCell && teamExpandedCell.engIdx === engIdx && teamExpandedCell.subIdx === subIdx && (
                        <tr className="workload-drill-row" key={`drill-${engIdx}-${subIdx}-${teamExpandedCell.weekIdx}`}>
                          <td colSpan={teamWeeks.length + 1} className={(() => {
                            const cell = subRow.cells[teamExpandedCell.weekIdx];
                            const cc = cellColorClass(cell);
                            if (cc === 'red-light') return 'drill-red';
                            if (cc === 'yellow-light') return 'drill-yellow';
                            if (cc === 'green-light') return 'drill-green';
                            return '';
                          })()}>
                            <div style={{fontWeight:600, marginBottom:8, fontSize:'0.85rem'}}>
                              {subRow.label} — {teamWeeks[teamExpandedCell.weekIdx]} ({weekToDateRange(teamWeeks[teamExpandedCell.weekIdx])})
                            </div>
                            {subRow.cells[teamExpandedCell.weekIdx].tasks.map(t => {
                              const projName = teamData[engIdx].data.projects.find(p => p.id === t.project)?.name || t.project || '';
                              const overdue = isOverdue(t);
                              const isDelegated = !!t.delegated_to;
                              const isReceived = !!t.delegated_by && !t.delegated_to;
                              return (
                                <div key={t.id} className={"drill-task" + (isDelegated || isReceived ? " drill-task-delegated" : "")}>
                                  <div style={{flex:1}}>
                                    <div className="drill-task-title">{t.title}</div>
                                    <div className="drill-task-meta">
                                      <span className={"task-meta-tag tag-priority-" + (t.priority || 'low')}>{PRIORITY_LABELS[t.priority] || 'LOW'}</span>
                                      <span className={"task-meta-tag tag-status-" + t.status}>{STATUS_LABELS[t.status] || t.status}</span>
                                      {t.due && <span className={"task-meta-tag " + (overdue ? "tag-due-overdue" : "tag-due")}>due {t.due}</span>}
                                      {projName && <span className="task-meta-tag tag-project">{projName}</span>}
                                      {isDelegated && <span className="task-meta-tag tag-delegated">DELEGATED → {t.delegated_to}</span>}
                                      {isReceived && <span className="task-meta-tag tag-delegated-by">FROM: {t.delegated_by}</span>}
                                    </div>
                                  </div>
                                  {(isDelegated || isReceived) && onJumpToTask && (
                                    <button className="btn btn-small" onClick={() => onJumpToTask(t)}
                                      title="Jump to this task in Planned view">→ View</button>
                                  )}
                                </div>
                              );
                            })}
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </React.Fragment>
            ))}
          </tbody>
        </table>

        {/* Legend */}
        <div className="workload-legend">
          <span className="workload-legend-item"><span className="workload-legend-swatch" style={{background:'var(--green-light)'}}></span> healthy (≤12)</span>
          <span className="workload-legend-item"><span className="workload-legend-swatch" style={{background:'var(--yellow-light)'}}></span> approaching (&gt;12)</span>
          <span className="workload-legend-item"><span className="workload-legend-swatch" style={{background:'var(--red-light)'}}></span> overloaded (&gt;16)</span>
          <span className="workload-legend-item"><span style={{color:'var(--red)', fontWeight:700}}>▲</span> priority concentration (&gt;2 crit/high)</span>
        </div>
      </div>
    );
  };

  // ===== Render priority cross-cut =====
  const renderPriority = () => {
    const priorityOrder = ['critical', 'high', 'medium', 'low'];
    return (
      <div>
        {priorityOrder.map(prio => {
          const tasks = teamPriorityData[prio] || [];
          if (tasks.length === 0) return null;
          return (
            <div key={prio} className="priority-section">
              <h3>{PRIORITY_LABELS[prio]}
                <span className="review-count" style={{
                  background: prio === 'critical' ? 'var(--red)' : prio === 'high' ? 'var(--orange)' : prio === 'medium' ? 'var(--yellow)' : 'var(--ink-muted)'
                }}>{tasks.length}</span>
              </h3>
              {tasks.map(t => {
                const overdue = isOverdue(t);
                return (
                  <div key={`${t.engineer}-${t.id}`} className="priority-row">
                    <div className="priority-row-title">{t.title}</div>
                    <div className="priority-row-meta">
                      <span style={{fontSize:'0.75rem', color:'var(--ink-muted)', fontWeight:600}}>{t.engineer}</span>
                      {t.due && <span className={"task-meta-tag " + (overdue ? "tag-due-overdue" : "tag-due")}>due {t.due}</span>}
                      {t.projectName && <span className="task-meta-tag tag-project">{t.projectName}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
        {priorityOrder.every(p => (teamPriorityData[p] || []).length === 0) && (
          <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'20px'}}>No active tasks across team.</p>
        )}
      </div>
    );
  };

  // ===== Render team review =====
  const renderTeamReview = () => {
    const { blocked, stale, upcoming, overloaded } = teamReviewData;
    return (
      <div>
        {/* Blocked */}
        <div className="team-review-section">
          <h3>Blocked <span className="review-count" style={{background:'var(--red)'}}>{blocked.length}</span></h3>
          {blocked.length === 0 ? (
            <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>No blocked tasks across team.</p>
          ) : (
            blocked.map(t => (
              <div key={`${t.engineer}-${t.id}`} className="team-review-entry">
                <div style={{fontWeight:600}}>{t.title}</div>
                <div style={{fontSize:'0.78rem', color:'var(--ink-muted)', marginTop:3}}>
                  <strong>{t.engineer}</strong>
                  {t.projectName && ` · ${t.projectName}`}
                </div>
                {t.notes && <div style={{fontSize:'0.78rem', color:'var(--ink-muted)', marginTop:3, fontStyle:'italic'}}>{t.notes}</div>}
              </div>
            ))
          )}
        </div>

        {/* Stale */}
        <div className="team-review-section">
          <h3>Stale (7+ days) <span className="review-count" style={{background:'var(--orange)'}}>{stale.length}</span></h3>
          {stale.length === 0 ? (
            <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>No stale tasks across team.</p>
          ) : (
            stale.map(t => (
              <div key={`${t.engineer}-${t.id}`} className="team-review-entry">
                <div style={{fontWeight:600}}>{t.title}</div>
                <div style={{fontSize:'0.78rem', color:'var(--ink-muted)', marginTop:3}}>
                  <strong>{t.engineer}</strong>
                  <span className={"task-meta-tag " + (t.veryStale ? "tag-very-stale" : "tag-stale")} style={{marginLeft:6}}>{t.daysOld}d old</span>
                  {t.projectName && ` · ${t.projectName}`}
                </div>
              </div>
            ))
          )}
        </div>

        {/* Overloaded Weeks */}
        <div className="team-review-section">
          <h3>Overloaded Weeks <span className="review-count" style={{background:'var(--red)'}}>{overloaded.length}</span></h3>
          {overloaded.length === 0 ? (
            <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>No overloaded weeks.</p>
          ) : (
            overloaded.map((o, i) => (
              <div key={i} className="team-review-entry">
                <strong>{o.engineer}</strong> — {o.week}: score {o.score}
                <span className="task-meta-tag" style={{
                  marginLeft: 8,
                  background: o.level === 'RED' ? 'var(--red-light)' : 'var(--yellow-light)',
                  color: o.level === 'RED' ? 'var(--red)' : 'var(--yellow)'
                }}>{o.level}</span>
              </div>
            ))
          )}
        </div>

        {/* Upcoming Deadlines */}
        <div className="team-review-section">
          <h3>Upcoming Deadlines (7 days) <span className="review-count" style={{background:'var(--blue)'}}>{upcoming.length}</span></h3>
          {upcoming.length === 0 ? (
            <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>No upcoming deadlines.</p>
          ) : (
            upcoming.map(t => (
              <div key={`${t.engineer}-${t.id}`} className="team-review-entry">
                <div style={{fontWeight:600}}>{t.title}</div>
                <div style={{fontSize:'0.78rem', color:'var(--ink-muted)', marginTop:3}}>
                  <strong>{t.engineer}</strong>
                  <span className="task-meta-tag tag-due" style={{marginLeft:6}}>due {t.due}</span>
                  {t.projectName && ` · ${t.projectName}`}
                </div>
              </div>
            ))
          )}
        </div>
      </div>
    );
  };

  return (
    <div className="team-container"
      onDragOver={handleTeamDragOver} onDragLeave={handleTeamDragLeave} onDrop={handleTeamDrop}
    >
      {/* Engineer chips */}
      <div className="team-sub-header">
        <div className="engineer-chips">
          {teamData.map((td, idx) => (
            <span key={idx} className="engineer-chip">
              {td.owner}
              <button className="engineer-chip-remove" onClick={() => removeEngineer(idx)}>×</button>
            </span>
          ))}
        </div>
        <button className="btn btn-small" onClick={() => teamFileInputRef.current?.click()}>+ Load Team Files</button>
        <button className="btn btn-small" onClick={refreshTeam} title="Reload team data from current task list">↻ Refresh</button>
      </div>

      {/* Sub-tabs */}
      <div className="sub-tabs">
        <div className={"sub-tab" + (teamSubView === 'workload' ? " active" : "")} onClick={() => setTeamSubView('workload')}>Workload</div>
        <div className={"sub-tab" + (teamSubView === 'priority' ? " active" : "")} onClick={() => setTeamSubView('priority')}>Priority</div>
        <div className={"sub-tab" + (teamSubView === 'review' ? " active" : "")} onClick={() => setTeamSubView('review')}>Review</div>
      </div>

      {/* Sub-view content */}
      {teamSubView === 'workload' && renderWorkload()}
      {teamSubView === 'priority' && renderPriority()}
      {teamSubView === 'review' && renderTeamReview()}

      <input type="file" ref={teamFileInputRef} style={{display:'none'}}
        accept=".yaml,.yml" multiple onChange={handleTeamFilePick} />
    </div>
  );
}

// ===== Review Mode Component =====
function ReviewMode({ reviewData, data, allWeeks, selectedWeek, bragExportText, copyBragToClipboard, toggleTaskDone, deleteTask, updateTask, updateData, setShowReviewMode, showToast }) {
  const nextWeek = shiftWeek(currentISOWeek(), 1);
  return (
    <div>
      <div className="header" style={{marginBottom:'12px'}}>
        <h1>Weekly Review</h1>
        <div className="header-actions">
          <button className="btn btn-primary" onClick={() => {
            updateData(d => { d.meta.last_review = todayStr(); });
            setShowReviewMode(false);
            showToast("Review complete — last_review updated");
          }}>✓ Complete Review</button>
          <button className="btn" onClick={() => setShowReviewMode(false)}>← Back</button>
        </div>
      </div>

      {/* Done This Week */}
      <div className="review-section">
        <h3>Completed <span className="review-count" style={{background:'var(--green)'}}>{reviewData.doneThisWeek.length}</span></h3>
        {reviewData.doneThisWeek.length === 0 ? (
          <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>Nothing completed yet this week.</p>
        ) : (
          reviewData.doneThisWeek.map(t => (
            <div key={t.id} className="task-card done">
              <div className="task-checkbox checked" onClick={() => toggleTaskDone(t.id)}></div>
              <div className="task-body">
                <div className="task-title">{t.title}</div>
              </div>
            </div>
          ))
        )}
        {reviewData.doneThisWeek.length > 0 && (
          <div className="brag-export" style={{marginTop:'12px'}}>
            <h3>Brag Log — Copy for 1:1s</h3>
            <pre>{bragExportText}</pre>
            <button className="copy-btn" onClick={copyBragToClipboard}>Copy to clipboard</button>
          </div>
        )}
      </div>

      {/* Stale Tasks */}
      <div className="review-section">
        <h3>Stale Tasks (7+ days, no progress) <span className="review-count" style={{background:'var(--orange)'}}>{reviewData.stale.length}</span></h3>
        {reviewData.stale.length === 0 ? (
          <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>No stale tasks. You're on top of things.</p>
        ) : (
          reviewData.stale.map(t => (
            <div key={t.id} className={"task-card " + (isVeryStale(t) ? "very-stale" : "stale")}>
              <div className="task-checkbox" onClick={() => toggleTaskDone(t.id)}></div>
              <div className="task-body">
                <div className="task-title">{t.title}</div>
                <div className="task-meta">
                  <span className={"task-meta-tag " + (isVeryStale(t) ? "tag-very-stale" : "tag-stale")}>{daysSince(t.last_touched || t.created)}d old</span>
                  <span className={"task-meta-tag tag-priority-" + (t.priority || 'low')}>{PRIORITY_LABELS[t.priority] || 'LOW'}</span>
                  {t.project && <span className="task-meta-tag tag-project">{data.projects.find(p => p.id === t.project)?.name || t.project}</span>}
                  {t.due && <span className={"task-meta-tag " + (isOverdue(t) ? "tag-due-overdue" : "tag-due")}>due {t.due}</span>}
                </div>
                <div className="review-task-actions">
                  <select value={t.week || ""} onChange={e => updateTask(t.id, 'week', e.target.value || null)}>
                    <option value="">Assign to week...</option>
                    {allWeeks.map(w => <option key={w} value={w}>{w}</option>)}
                  </select>
                  <button className="btn btn-small" onClick={() => { updateTask(t.id, 'week', nextWeek); showToast(`${t.id} → ${nextWeek}`); }}>Next Week</button>
                  <button className="btn btn-small" onClick={() => { updateTask(t.id, 'status', 'deferred'); showToast(`${t.id} deferred`); }}>Defer</button>
                  <button className="btn btn-small btn-danger" onClick={() => deleteTask(t.id)}>Delete</button>
                </div>
              </div>
            </div>
          ))
        )}
      </div>

      {/* Unassigned Tasks */}
      <div className="review-section">
        <h3>Unassigned Tasks (no week) <span className="review-count">{reviewData.unassigned.length}</span></h3>
        {reviewData.unassigned.length === 0 ? (
          <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>All tasks assigned to a week.</p>
        ) : (
          reviewData.unassigned.map(t => (
            <div key={t.id} className="task-card">
              <div className="task-checkbox" onClick={() => toggleTaskDone(t.id)}></div>
              <div className="task-body">
                <div className="task-title">{t.title}</div>
                <div className="task-meta">
                  <span className={"task-meta-tag tag-priority-" + (t.priority || 'low')}>{PRIORITY_LABELS[t.priority] || 'LOW'}</span>
                                   </div>
                <div className="review-task-actions">
                  <select value="" onChange={e => { if (e.target.value) updateTask(t.id, 'week', e.target.value); }}>
                    <option value="">Assign to week...</option>
                    {allWeeks.map(w => <option key={w} value={w}>{w}</option>)}
                  </select>
                  <button className="btn btn-small" onClick={() => { updateTask(t.id, 'week', nextWeek); showToast(`${t.id} → ${nextWeek}`); }}>Next Week</button>
                  <button className="btn btn-small" onClick={() => { updateTask(t.id, 'status', 'deferred'); showToast(`${t.id} deferred`); }}>Defer</button>
                  <button className="btn btn-small btn-danger" onClick={() => deleteTask(t.id)}>Delete</button>
                </div>
              </div>
            </div>
          ))
        )}
      </div>

      {/* Blocked Tasks */}
      <div className="review-section">
        <h3>Blocked <span className="review-count" style={{background:'var(--red)'}}>{reviewData.blocked.length}</span></h3>
        {reviewData.blocked.length === 0 ? (
          <p style={{color:'var(--ink-muted)', fontStyle:'italic', padding:'8px 0'}}>No blocked tasks. Flow state.</p>
        ) : (
          reviewData.blocked.map(t => (
            <div key={t.id} className="task-card blocked">
              <div className="task-checkbox" onClick={() => toggleTaskDone(t.id)}></div>
              <div className="task-body">
                <div className="task-title">{t.title}</div>
                {t.notes && <div className="task-notes">{t.notes}</div>}
                <div className="review-task-actions">
                  <button className="btn btn-small" onClick={() => updateTask(t.id, 'status', 'open')}>Unblock</button>
                </div>
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

// ===== Task Card Component =====
function TaskCard({ task, data, editingTask, setEditingTask, toggleTaskDone, deleteTask, updateTask, allWeeks, knownEngineers, delegateTask, undelegateTask, isCarryover, isThread, viewMode, showToast }) {
  const isEditing = editingTask === task.id;
  const stale = isStale(task);
  const veryStale = isVeryStale(task);
  const overdue = isOverdue(task);

  // Pending fields — all edit form values staged locally, committed on Done (F4)
  const [pendingFields, setPendingFields] = useState({});
  // Ref for notes textarea auto-fit (F6)
  const notesRef = useRef(null);

  // Sync pending fields when edit mode opens or task changes while editing
  useEffect(() => {
    if (isEditing) {
      setPendingFields({
        title: task.title || '',
        project: task.project || '',
        priority: task.priority || '',
        status: task.status || '',
        energy: task.energy || '',
        due: task.due || '',
        week: task.week || '',
        context: task.context || '',
        estimate: task.estimate || '',
        notes: task.notes || '',
        delegated_to: task.delegated_to || ''
      });
    }
  }, [isEditing, task]);

  // Auto-fit notes textarea on edit open and content change (F6)
  useEffect(() => {
    if (isEditing && notesRef.current) {
      const ta = notesRef.current;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
    }
  }, [isEditing, pendingFields.notes, task.notes]);

  let cardClass = "task-card";
  if (isCarryover) cardClass += " carryover";
  else if (task.delegated_to) cardClass += " delegated";
  else if (task.status === 'done') cardClass += " done";
  else if (task.status === 'blocked') cardClass += " blocked";
  else if (task.status === 'thread') cardClass += " thread";
  else if (veryStale) cardClass += " very-stale";
  else if (stale) cardClass += " stale";

  // Edit form field order for Tab cycling
  const editFields = [
    { key: 'title', type: 'text', label: 'Title', full: true },
    { key: 'project', type: 'select', label: 'Project', options: [...(data.projects || [])].sort((a, b) => (a.name || a.id || '').localeCompare(b.name || b.id || '')), optLabel: 'No project' },
    { key: 'priority', type: 'select-labels', label: 'Priority', labels: PRIORITY_LABELS },
    { key: 'status', type: 'select-labels', label: 'Status', labels: STATUS_LABELS },
    { key: 'energy', type: 'select-labels', label: 'Energy', labels: ENERGY_LABELS },
    { key: 'due', type: 'date', label: 'Due Date' },
    { key: 'week', type: 'select-weeks', label: 'Week', weeks: allWeeks },
    { key: 'context', type: 'select-labels', label: 'Context', labels: CONTEXT_LABELS },
    { key: 'estimate', type: 'text', label: 'Estimate' },
    { key: 'notes', type: 'textarea', label: 'Notes', full: true },
    { key: 'delegate', type: 'delegate', label: 'Delegate to', full: true },
  ];

  const handleTabKey = useCallback((e) => {
    e.preventDefault();
    const fieldIds = editFields.map(f => `edit-${task.id}-${f.key}`);
    const currentIdx = fieldIds.indexOf(e.target.id);
    const nextIdx = (currentIdx + 1) % fieldIds.length;
    const nextEl = document.getElementById(fieldIds[nextIdx]);
    if (nextEl) nextEl.focus();
  }, [editFields, task.id]);

  if (isEditing) {
    return (
      <div className="task-edit">
        <div className="task-edit-grid">
          {editFields.map((f, i) => (
            <div key={f.key} className={"task-edit-field" + (f.full ? " task-edit-full" : "")}>
              <label>{f.label}</label>
              {f.type === 'text' && (
                <input type="text" id={`edit-${task.id}-${f.key}`} value={pendingFields[f.key] ?? task[f.key] ?? ""}
                  onChange={e => setPendingFields(prev => ({...prev, [f.key]: e.target.value}))}
                  onKeyDown={e => { if (e.key === 'Tab') handleTabKey(e); }}
                  autoFocus={i === 0} />
              )}
              {f.type === 'date' && (
                <input type="date" id={`edit-${task.id}-${f.key}`} value={pendingFields[f.key] ?? task[f.key] ?? ""}
                  onChange={e => setPendingFields(prev => ({...prev, [f.key]: e.target.value || null}))}
                  onKeyDown={e => { if (e.key === 'Tab') handleTabKey(e); }} />
              )}
              {f.type === 'textarea' && (
                <textarea id={`edit-${task.id}-${f.key}`} ref={notesRef}
                  value={pendingFields[f.key] ?? task[f.key] ?? ""}
                  placeholder="Additional context..."
                  onChange={e => setPendingFields(prev => ({...prev, [f.key]: e.target.value}))}
                  onKeyDown={e => { if (e.key === 'Tab') handleTabKey(e); }}
                  style={{minHeight:'40px', resize:'vertical'}} />
              )}
              {f.type === 'select' && (
                <select id={`edit-${task.id}-${f.key}`} value={pendingFields[f.key] ?? task[f.key] ?? ""}
                  onChange={e => setPendingFields(prev => ({...prev, [f.key]: e.target.value || null}))}
                  onKeyDown={e => { if (e.key === 'Tab') handleTabKey(e); }}>
                  <option value="">{f.optLabel}</option>
                  {f.options.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              )}
              {f.type === 'select-labels' && (
                <select id={`edit-${task.id}-${f.key}`} value={pendingFields[f.key] ?? task[f.key] ?? ""}
                  onChange={e => setPendingFields(prev => ({...prev, [f.key]: e.target.value}))}
                  onKeyDown={e => { if (e.key === 'Tab') handleTabKey(e); }}>
                  {Object.entries(f.labels).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
                </select>
              )}
              {f.type === 'select-weeks' && (
                <select id={`edit-${task.id}-${f.key}`} value={pendingFields.week ?? ''}
                  onChange={e => setPendingFields(prev => ({...prev, week: e.target.value}))}
                  onKeyDown={e => { if (e.key === 'Tab') handleTabKey(e); }}>
                  <option value="">No week</option>
                  {f.weeks.map(w => <option key={w} value={w}>{w}</option>)}
                </select>
              )}
              {f.type === 'delegate' && (
                <div className="delegate-field">
                  <input type="text" id={`edit-${task.id}-${f.key}`}
                    value={pendingFields.delegated_to ?? ''}
                    onChange={e => setPendingFields(prev => ({...prev, delegated_to: e.target.value}))}
                    onKeyDown={e => { if (e.key === 'Tab') handleTabKey(e); }}
                    placeholder="Engineer name (or leave empty)"
                    list="known-engineers-list" />
                  <datalist id="known-engineers-list">
                    {knownEngineers.map(e => <option key={e} value={e} />)}
                  </datalist>
                  {task.delegated_to && (
                    <button className="btn btn-small" onClick={() => setPendingFields(prev => ({...prev, delegated_to: ''}))}
                      title="Clear delegation">Clear</button>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
        <div className="task-edit-actions">
          <button className="btn btn-small" onClick={() => {
            // Commit all changed fields (F4)
            Object.keys(pendingFields).forEach(key => {
              const newVal = pendingFields[key];
              const oldVal = task[key] || '';
              if (newVal !== oldVal) {
                if (key === 'delegated_to') {
                  if (newVal && newVal.trim()) {
                    delegateTask(task.id, newVal.trim());
                  } else if (task.delegated_to) {
                    undelegateTask(task.id);
                  }
                } else {
                  updateTask(task.id, key, newVal || null);
                }
              }
            });
            setEditingTask(null);
          }}>Done</button>
          <button className="btn btn-small btn-danger" onClick={() => deleteTask(task.id)}>Delete</button>
        </div>
      </div>
    );
  }

  return (
    <div className={cardClass}>
      <div className={"task-checkbox" + (task.status === 'done' ? " checked" : "")}
        onClick={() => toggleTaskDone(task.id)}></div>
      <div className="task-body">
        <div className="task-title">{task.title}</div>
        <div className="task-meta">
          <span className={"task-meta-tag tag-priority-" + (task.priority || 'low')} title="Priority">
            PRIO: {PRIORITY_LABELS[task.priority] || 'LOW'}
          </span>
          {task.status !== 'open' && task.status !== 'done' && (
            <span className={"task-meta-tag tag-status-" + task.status}>{STATUS_LABELS[task.status]}</span>
          )}
          <span className={"task-meta-tag tag-energy-" + (task.energy || 'medium')} title="Energy level">
            ENERGY: {ENERGY_LABELS[task.energy] || 'MED'}
          </span>
          {task.project && (
            <span className="task-meta-tag tag-project">
              {data.projects.find(p => p.id === task.project)?.name || task.project}
            </span>
          )}
          {/* Week flair badge (F6) — show Wxx on non-carryover cards */}
          {task.week && !isCarryover && (
            <span className="task-meta-tag tag-week" title={`Planned for ${task.week}`}>
              {task.week.split('-')[1]}
            </span>
          )}
          {isCarryover && task.week && (
            <span className="task-meta-tag tag-carryover" title={`Originally planned for ${task.week}`}>
              PLANNED: {task.week}
            </span>
          )}
          {task.due && (
            <span className={"task-meta-tag " + (overdue ? "tag-due-overdue" : "tag-due")}>
              {overdue ? '! ' : ''}due {task.due}
            </span>
          )}
          {task.estimate && <span className="task-meta-tag tag-project">{task.estimate}</span>}
          {task.delegated_to && (
            <span className="task-meta-tag tag-delegated" title={`Delegated to ${task.delegated_to}${task.delegation_date ? ' on ' + task.delegation_date : ''}`}>
              DELEGATED → {task.delegated_to}
            </span>
          )}
          {task.delegated_by && !task.delegated_to && (
            <span className="task-meta-tag tag-delegated-by" title={`Delegated by ${task.delegated_by}`}>
              FROM: {task.delegated_by}
            </span>
          )}
          {stale && <span className={"task-meta-tag " + (veryStale ? "tag-very-stale" : "tag-stale")}>{daysSince(task.last_touched || task.created)}d old</span>}
        </div>
        {task.notes && <div className="task-notes">{task.notes}</div>}
      </div>
      <div className="task-actions">
        <button className="task-action-btn" onClick={() => setEditingTask(task.id)}>▸ Edit</button>
        {viewMode === 'week' && task.status !== 'done' && task.status !== 'deferred' && (
          <>
            <button className="task-action-btn quick-push" title="Push to next week"
              onClick={() => { const nw = weekOffset(task.week, 1); updateTask(task.id, 'week', nw); if (showToast) showToast(`Pushed to ${nw}`); }}>+1W</button>
            <button className="task-action-btn quick-push" title="Push two weeks out"
              onClick={() => { const nw = weekOffset(task.week, 2); updateTask(task.id, 'week', nw); if (showToast) showToast(`Pushed to ${nw}`); }}>+2W</button>
          </>
        )}
        <button className="task-action-btn danger" onClick={() => deleteTask(task.id)}>×</button>
      </div>
    </div>
  );
}

// ===== Render =====
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
      .catch(err => console.log('[PWA] SW registration failed:', err));
  });
}
</script>
</body>
</html>
